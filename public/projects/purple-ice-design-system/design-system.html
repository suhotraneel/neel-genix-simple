      display: grid;
      width: 100%;
      height: 100%;
      min-height: 240px;
    }
    .grid-frame__col {
      background: color-mix(in srgb, var(--color-purple-800) 14%, transparent);
      border: var(--border-sm) dashed color-mix(in srgb, var(--color-purple-800) 40%, transparent);
      border-radius: var(--radius-4);
      position: relative;
      min-height: 240px;
    }
    .grid-frame__col-num {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: var(--color-purple-800);
      opacity: 0.7;
    }

    .grid-preview__spec {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: var(--space-2);
      background: var(--color-surface-subtle);
      border-radius: var(--radius-12);
      border: var(--border-sm) solid var(--color-border-subtle);
      align-self: flex-start;
    }
    .grid-preview__spec-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-8);
      background: var(--color-surface-base);
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
      transition: background-color var(--duration-fast) var(--easing-standard);
    }
    .grid-preview__spec-row:hover { background: var(--color-surface-brand); }
    .grid-preview__spec-row--static { cursor: default; }
    .grid-preview__spec-row--static:hover { background: var(--color-surface-base); }
    .grid-preview__spec-label {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }
    .grid-preview__spec-val {
      font-size: var(--text-base);
      color: var(--color-text-primary);
      font-weight: var(--font-weight-semibold);
    }

    /* ── Elevation ─────────────────────────────────────────── */

    .elevation-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: var(--space-4);
    }
    .elevation-card {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      padding: var(--space-4);
      background: var(--color-surface-subtle);
      border-radius: var(--radius-12);
      border: var(--border-sm) solid var(--color-border-subtle);
    }
    .elevation-card__well {
      height: 140px;
      background: var(--color-surface-subtle);
      border-radius: var(--radius-8);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-3);
    }
    .elevation-card__sample {
      width: 100%;
      height: 100%;
      background: var(--color-surface-elevated);
      border-radius: var(--radius-8);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .elevation-card__level {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-2xl);
      color: var(--color-text-muted);
      font-weight: var(--font-weight-semibold);
    }
    .elevation-card__token {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
      text-align: left;
      cursor: pointer;
    }
    .elevation-card__token:hover { color: var(--color-text-brand); }
    .elevation-card__note {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    /* ── Motion ────────────────────────────────────────────── */

    .motion-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: var(--space-4);
    }
    .motion-card {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      padding: var(--space-4);
      background: var(--color-surface-elevated);
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-12);
    }
    .motion-card__demo {
      height: 60px;
      background: var(--color-surface-subtle);
      border-radius: var(--radius-8);
      display: flex;
      align-items: center;
      padding: 0 var(--space-3);
      overflow: hidden;
    }
    .motion-card__pulse {
      width: 12px;
      height: 12px;
      border-radius: var(--radius-round);
      background: var(--color-brand-primary);
      animation: motion-card-pulse 1.6s var(--easing-emphasized) infinite alternate;
      animation-duration: calc(var(--motion-duration, 200ms) * 6);
    }
    @keyframes motion-card-pulse {
      0% { transform: translateX(0); }
      100% { transform: translateX(120px); }
    }
    .motion-card__easing {
      background: var(--color-surface-subtle);
      border-radius: var(--radius-8);
      padding: var(--space-2);
      color: var(--color-brand-primary);
    }
    .motion-card__token {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
      text-align: left;
      cursor: pointer;
    }
    .motion-card__token:hover { color: var(--color-text-brand); }
    .motion-card__num {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-base);
      color: var(--color-text-secondary);
    }
    .motion-card__curve {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .motion-card__note {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    /* ── Z-stack ───────────────────────────────────────────── */

    .z-stack {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      padding: var(--space-6);
      background: var(--color-surface-subtle);
      border-radius: var(--radius-12);
      border: var(--border-sm) solid var(--color-border-subtle);
    }
    .z-stack__row {
      display: grid;
      grid-template-columns: 200px 80px 1fr;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-3) var(--space-4);
      background: var(--color-surface-elevated);
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-8);
      box-shadow: var(--shadow-1);
    }
    .z-stack__token {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-base);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
      text-align: left;
      cursor: pointer;
    }
    .z-stack__token:hover { color: var(--color-text-brand); }
    .z-stack__val {
      font-family: "JetBrains Mono", monospace;
      color: var(--color-text-secondary);
    }
    .z-stack__note {
      font-size: var(--text-base);
      color: var(--color-text-muted);
    }

    /* ── Platforms ─────────────────────────────────────────── */

    .platforms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: var(--space-4);
    }
    .platform-card {
      display: flex;
      flex-direction: column;
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-12);
      overflow: hidden;
      background: var(--color-surface-elevated);
      text-align: left;
      cursor: pointer;
      transition: var(--transition-transform), box-shadow var(--duration-fast) var(--easing-standard);
      padding: 0;
    }

      flex-direction: column;

      top: var(--space-3);
      right: var(--space-3);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: var(--text-sm);
      font-family: "JetBrains Mono", monospace;
      padding: 2px var(--space-2);

      box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 8%, transparent);

    .platform-card__hero-name {
      font-size: var(--text-2xl);
      font-weight: var(--font-weight-semibold);
      letter-spacing: -0.02em;

    .platform-card__body {
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      flex: 1;
      background: var(--color-surface-elevated);

    .platform-card__status {
      align-self: flex-start;
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      padding: 2px var(--space-2);
      border-radius: var(--radius-round);
      letter-spacing: 0.04em;
      text-transform: uppercase;

    .platform-card__status--shipped {
      background: var(--color-success-surface);
      color: var(--color-accent-green-700);
    }
    .platform-card__status--in-design {
      background: var(--color-warning-surface);
      color: var(--color-yellow-700);
    }
    .platform-card__audience {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      margin: 0;
    }
    .platform-card__summary {
      font-size: var(--text-base);
      color: var(--color-text-secondary);
      margin: 0;
      line-height: 1.5;
      text-wrap: pretty;
    }
    .platform-card__token {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      margin-top: auto;

      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: var(--space-2);
      padding: var(--space-4);
      background: var(--color-surface-subtle);
      border-radius: var(--radius-12);
      border: var(--border-sm) solid var(--color-border-subtle);
    }
    .theming-layer {
      padding: var(--space-4);
      background: var(--color-surface-elevated);
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-8);
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }
    .theming-layer__num {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-round);
      background: var(--color-brand-primary);
      color: var(--color-text-onbrand);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      font-weight: var(--font-weight-semibold);
    }
    .theming-layer__title {
      font-size: var(--text-md);
      color: var(--color-text-primary);
    }
    .theming-layer__sub {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      line-height: 1.5;
    }
    .theming-layer__sub code {
      font-size: var(--text-sm);
      color: var(--color-text-brand);
      background: var(--color-surface-brand);
      padding: 1px 4px;
      border-radius: var(--radius-4);
    }

    .platform-matrix {
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-12);
      overflow: hidden;
      background: var(--color-surface-elevated);

    .platform-matrix__head,
    .platform-matrix__row {
      display: grid;
      grid-template-columns: 180px repeat(4, 1fr);
      align-items: center;
      padding: var(--space-3) var(--space-4);
      border-top: var(--border-sm) solid var(--color-border-subtle);
    }
    .platform-matrix__head {
      background: var(--color-surface-subtle);
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-top: 0;
    }
    .platform-matrix__label {
      font-size: var(--text-base);
      color: var(--color-text-secondary);
    }
    .platform-matrix__val {
      font-size: var(--text-base);
      color: var(--color-text-primary);
      font-weight: var(--font-weight-medium);
    }

      padding: var(--space-6);
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-12);
      background: var(--color-surface-elevated);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .rule-card p { margin: 0; line-height: 1.6; color: var(--color-text-secondary); text-wrap: pretty; }
    .rule-card p strong { color: var(--color-text-primary); }
    .rule-card__flag {
      margin: 0;
      padding: var(--space-3) var(--space-4);
      background: var(--color-warning-surface);
      color: var(--color-yellow-700);
      border-radius: var(--radius-8);
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-base);
      white-space: pre-wrap;
    }
    .rule-card__flag code {
      color: var(--color-yellow-800);
      background: rgba(0,0,0,0.06);
      padding: 1px 4px;
      border-radius: var(--radius-4);
    }

    .step-list {
      margin: 0;
      padding: 0 0 0 var(--space-6);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .step-list li {
      font-size: var(--text-md);
      line-height: 1.55;
      color: var(--color-text-secondary);
    }
    .step-list li strong { color: var(--color-text-primary); }

    .naming-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: var(--space-3);

    .naming-card {

      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-12);

      display: flex;
      flex-direction: column;
      gap: var(--space-2);

      font-size: var(--text-md);
      color: var(--color-text-primary);

      color: var(--color-text-brand);

      align-self: flex-start;

      font-size: var(--text-base);
      color: var(--color-text-secondary);
      line-height: 1.55;
    }
    .naming-card p code {
      background: transparent;
      padding: 0;
      color: var(--color-text-brand);
    }

      display: flex;
      flex-direction: column;
      gap: var(--space-2);

    .check-list li {
      font-size: var(--text-base);
      line-height: 1.5;
      color: var(--color-text-secondary);

      color: var(--color-text-secondary);

      color: var(--color-text-brand);
      background: var(--color-surface-brand);
      padding: 1px 4px;
      border-radius: var(--radius-4);
    }

    .memory-grid {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .memory-card {
      display: grid;
      grid-template-columns: 40px 1fr auto;
      align-items: center;
      gap: var(--space-4);

    .memory-card:hover {
      transform: translateX(2px);
      text-decoration: none;
      border-color: var(--color-border-brand);
    }
    .memory-card__icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-8);
      background: var(--color-surface-brand);
      color: var(--color-text-brand);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .memory-card__body {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .memory-card__path {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-base);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
    }
    .memory-card__desc {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }
    .memory-card__chev {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-lg);
      color: var(--color-text-muted);
    }

    /* ── Topbar wrap behavior ──────────────────────────────── */

    @media (max-width: 1100px) {
      .topbar__inner { flex-direction: column; align-items: stretch; gap: var(--space-2); }
      .topbar__main { width: 100%; }
      .platform-switcher { justify-content: space-between; width: 100%; padding-bottom: var(--space-2); border-bottom: var(--border-sm) solid var(--color-border-subtle); flex-wrap: wrap; }
    }

    /* ── Responsive ────────────────────────────────────────── */

    @media (max-width: 760px) {
      .topnav { display: none; }
      .brand__sub { display: none; }

      }
      .bars-head, .bars-row {
        grid-template-columns: 1fr 1fr;
      }
      .scale-table__bar-cell { grid-column: 1 / -1; }
      .scale-table__head span:nth-child(4),
      .scale-table__head span:nth-child(5),
      .scale-table__head span:nth-child(6) { display: none; }

// Purple Ice — Color editing hooks
// State + localStorage sync for rename/reorder of color swatches.

(function () {
  const { useState, useEffect, useCallback, useMemo } = React;

  const STORAGE_KEY = "purple-ice-color-edits-v1";

  function loadEdits() {
    // EDITMODE block is the on-disk source of truth. Trust it even when the
    // value is an empty object — that means "no edits", not "no data".
    if (window.TWEAK_DEFAULTS && typeof window.TWEAK_DEFAULTS.colorEdits === "object" && window.TWEAK_DEFAULTS.colorEdits !== null) {
      return window.TWEAK_DEFAULTS.colorEdits;
    }
    // Fall back to localStorage only if the EDITMODE block is missing entirely.
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      return typeof parsed === "object" && parsed ? parsed : {};
    } catch (e) {
      return {};
    }
  }

  function persistEdits(edits) {
    // localStorage = same-session cache (instant)
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(edits));
    } catch (e) {}
    // postMessage = persist into design-system.html itself (survives reloads / sessions)
    try {
      window.parent.postMessage(
        { type: "__edit_mode_set_keys", edits: { colorEdits: edits } },
        "*"
      );
    } catch (e) {}
  }

  function useColorEdits() {
    const [edits, setEdits] = useState(loadEdits);

    useEffect(() => {
      persistEdits(edits);
    }, [edits]);

    const rename = useCallback((groupId, origToken, newToken) => {
      setEdits(prev => {
        const groupEdits = { ...(prev[groupId] || {}) };
        const renames = { ...(groupEdits.renames || {}) };
        const trimmed = (newToken || "").trim();
        if (trimmed && trimmed !== origToken) {
          renames[origToken] = trimmed;
        } else {
          delete renames[origToken];
        }
        groupEdits.renames = renames;
        const next = { ...prev, [groupId]: groupEdits };
        if (!Object.keys(renames).length && !groupEdits.order) {
          delete next[groupId];
        }
        return next;
      });
    }, []);

    const reorder = useCallback((groupId, newOrder) => {
      setEdits(prev => {
        const groupEdits = { ...(prev[groupId] || {}), order: newOrder };
        return { ...prev, [groupId]: groupEdits };
      });
    }, []);

    // Per-stop overrides for hex + Figma name. Filling a hex on a `gap: true`
    // stop is what 'fills' it — applyEditsToGroup strips the gap flag if an
    // override hex is set.
    const setStopField = useCallback((groupId, origToken, field, value) => {
      setEdits(prev => {
        const groupEdits = { ...(prev[groupId] || {}) };
        const stops = { ...(groupEdits.stops || {}) };
        const stop = { ...(stops[origToken] || {}) };
        const trimmed = (value || "").trim();
        if (trimmed) {
          stop[field] = trimmed;
        } else {
          delete stop[field];
        }
        if (Object.keys(stop).length) {
          stops[origToken] = stop;
        } else {
          delete stops[origToken];
        }
        if (Object.keys(stops).length) {
          groupEdits.stops = stops;
        } else {
          delete groupEdits.stops;
        }
        const next = { ...prev, [groupId]: groupEdits };
        if (!Object.keys(groupEdits.renames || {}).length &&
            !groupEdits.order &&
            !(groupEdits.deleted && groupEdits.deleted.length) &&
            !groupEdits.stops) {
          delete next[groupId];
        }
        return next;
      });
    }, []);

    const deleteStop = useCallback((groupId, origToken) => {
      setEdits(prev => {
        const groupEdits = { ...(prev[groupId] || {}) };
        const deleted = new Set(groupEdits.deleted || []);
        deleted.add(origToken);
        groupEdits.deleted = Array.from(deleted);
        // Also drop from order list if present
        if (groupEdits.order) {
          groupEdits.order = groupEdits.order.filter(t => t !== origToken);
          if (!groupEdits.order.length) delete groupEdits.order;
        }
        return { ...prev, [groupId]: groupEdits };
      });
    }, []);

    const restoreStop = useCallback((groupId, origToken) => {
      setEdits(prev => {
        if (!prev[groupId] || !prev[groupId].deleted) return prev;
        const groupEdits = { ...prev[groupId] };
        groupEdits.deleted = groupEdits.deleted.filter(t => t !== origToken);
        if (!groupEdits.deleted.length) delete groupEdits.deleted;
        const next = { ...prev, [groupId]: groupEdits };
        if (!Object.keys(groupEdits.renames || {}).length && !groupEdits.order && !groupEdits.deleted) {
          delete next[groupId];
        }
        return next;
      });
    }, []);

    const resetGroup = useCallback((groupId) => {
      setEdits(prev => {
        if (!prev[groupId]) return prev;
        const next = { ...prev };
        delete next[groupId];
        return next;
      });
    }, []);

    const reset = useCallback(() => setEdits({}), []);

    const hasEdits = Object.keys(edits).length > 0;
    const editCount = useMemo(() => {
      let n = 0;
      for (const g of Object.values(edits)) {
        if (g.renames) n += Object.keys(g.renames).length;
        if (g.order) n += 1;
        if (g.deleted) n += g.deleted.length;
        if (g.stops) {
          for (const s of Object.values(g.stops)) n += Object.keys(s).length;
        }
      }
      return n;
    }, [edits]);

    return { edits, rename, reorder, deleteStop, restoreStop, resetGroup, reset, setStopField, hasEdits, editCount };
  }

  // Apply edits to a group's stops, returning a re-ordered/renamed list.
  // Each returned stop has _origToken preserved so the source token is
  // available for keys, drag identifiers, and Figma-name mapping.
  function applyEditsToGroup(group, groupEdits) {
    const deletedSet = new Set((groupEdits && groupEdits.deleted) || []);
    const stopOverrides = (groupEdits && groupEdits.stops) || {};
    const baseStops = group.stops
      .filter(s => !deletedSet.has(s.token))
      .map(s => {
        const o = stopOverrides[s.token] || {};
        let hex = s.hex;
        let figma = s.figma;
        let gap = !!s.gap;
        let editedFields = [];
        if (o.hex) {
          // Normalise hex: ensure leading #, uppercase
          let h = o.hex.startsWith("#") ? o.hex : `#${o.hex}`;
          hex = h.toUpperCase();
          gap = false; // filling a gap un-gaps it
          editedFields.push("hex");
        }
        if (o.figma) {
          figma = o.figma;
          editedFields.push("figma");
        }
        return {
          ...s,
          hex,
          figma,
          gap,
          _origToken: s.token,
          _origHex: s.hex,
          _origFigma: s.figma,
          _wasGap: !!s.gap,
          _edited: editedFields.length ? editedFields : null,
        };
      });
    const { renames = {}, order = null } = groupEdits || {};

    const renamed = baseStops.map(s => {
      const newToken = renames[s.token];
      return newToken
        ? { ...s, token: newToken, _renamed: true, _figmaToken: s.token }
        : s;
    });

    if (!order || !order.length) return renamed;

    const byOrig = new Map(renamed.map(s => [s._origToken, s]));
    const ordered = [];
    for (const origToken of order) {
      const stop = byOrig.get(origToken);
      if (stop) ordered.push(stop);
    }
    // append any stops not in the order list (e.g. added later) at the end
    for (const s of renamed) {
      if (!order.includes(s._origToken)) ordered.push(s);
    }
    return ordered;
  }

  // For the semantic table: propagate token renames into the `value` strings
  // so the alias arrow stays accurate.
  function applyRenamesToSemantic(semantic, edits) {
    if (!edits || !Object.keys(edits).length) return semantic;
    const renameMap = new Map();
    for (const g of Object.values(edits)) {
      for (const [orig, next] of Object.entries(g.renames || {})) {
        renameMap.set(`--color-${orig}`, `--color-${next}`);
      }
    }
    if (!renameMap.size) return semantic;
    return semantic.map(row => {
      const renamed = renameMap.get(row.value);
      return renamed ? { ...row, value: renamed, _origValue: row.value } : row;
    });
  }

  window.DSEdits = { useColorEdits, applyEditsToGroup, applyRenamesToSemantic };
})();

// Purple Ice — File export
// Regenerates design-system.md and tokens.css from the current (edited)
// token data. Pure functions — no React.

(function () {
  function mdRow(cells) {

  function escapeBackticks(s) {

  }

  // ── Markdown ─────────────────────────────────────────────────────

  function renderColorGroupMd(group) {
    const headerNote = group.notes ? ` — *${group.role}*` : ` — *${group.role}*`;
    const lines = [];
    lines.push(`#### ${group.name}${headerNote}`);
    lines.push("");
    if (group.notes) {
      lines.push(group.notes);
      lines.push("");
    }
    lines.push(mdRow(["Token", "Hex", "Figma name"]));
    lines.push(mdRow(["---", "---", "---"]));
    for (const s of group.stops) {
      if (s.gap) {
        lines.push(mdRow([`\`--color-${s.token}\``, "—", "gap"]));
        continue;
      }
      const tokenCell = s.anchor
        ? `**\`--color-${s.token}\`**`
        : `\`--color-${s.token}\``;
      const hexCell = s.anchor ? `**\`${s.hex}\`**` : `\`${s.hex}\``;
      let figmaCell = s.figma || "—";
      if (s.anchor) figmaCell = `**${figmaCell} · ANCHOR**`;
      // Original auto-rename warning becomes stale once the user renames the swatch themselves
      if (s.warn && !s._renamed) figmaCell = `⚠️ ${figmaCell} (${s.warn})`;
      if (s._renamed) {
        figmaCell = `${figmaCell} · renamed from \`--color-${s._origToken}\``;
      }
      lines.push(mdRow([tokenCell, hexCell, escapeBackticks(figmaCell)]));
    }
    lines.push("");
    return lines.join("\n");
  }

  function renderMarkdown({
    colorGroups,
    baseColors,
    semantic,
    fontWeights,
    typeScale,
    spacing,
    sizing,
    radius,
    border,
  }) {
    const L = [];

    L.push("# Purple Ice Design System");
    L.push("");
    L.push("> Source of truth for the Student product surface. Paste this file into any");
    L.push("> future Claude session to preserve continuity.");
    L.push("");
    L.push("---");
    L.push("");
    L.push("## Instructions for Claude");
    L.push("");
    L.push("You are working with an existing design system. When generating any UI:");
    L.push("");

    L.push("- **You have 20% flexibility** to introduce new values ONLY when the existing system genuinely doesn't cover a need. When you do, flag it explicitly: `⚠️ New token introduced: [name] — reason: [why]` so the design owner can decide whether to promote it into the system.");

    L.push("- **`Main` / `Default` → 500.** Figma uses a named `Main` (or `Default` for EDGE Blue) anchor shade per ramp; this is the brand anchor and is mapped to the `-500` slot. Figma's original `500` values, where they existed, were renamed to `-450` to avoid the collision. This is documented in the swatch table.");

    L.push("### Typography");

    L.push("#### Weights");
    L.push("");
    L.push(mdRow(["Token", "Numeric", "Poppins style name"]));

    L.push("");

  function renderTokensCss({

    L.push("     COLORS — RAW SCALES");
    L.push("     ════════════════════════════════════════════════════════════════ */");
    L.push("");
    L.push("  /* — Base — */");
    for (const b of baseColors) {
      L.push(`  --color-${b.token}: ${b.hex};`);
    }
    L.push("");
    for (const group of colorGroups) {
      L.push(`  /* — ${group.name} — */`);
      const maxLen = Math.max(...group.stops.map(s => `--color-${s.token}:`.length));
      for (const s of group.stops) {
        const pad = " ".repeat(Math.max(0, maxLen - `--color-${s.token}:`.length));
        if (s.gap) {
          L.push(`  /* gap: ${s.token.split("-").pop()} — not defined in source */`);
          continue;
        }
        let line = `  --color-${s.token}:${pad} ${s.hex};`;
        if (s.anchor) line += "  /* ← ANCHOR */";
        if (s.warn && !s._renamed) line += `  /* ⚠️ ${s.warn} */`;
        if (s._renamed) line += `  /* renamed from --color-${s._origToken} */`;
        L.push(line);
      }
      L.push("");
    }

    L.push("  /* ════════════════════════════════════════════════════════════════");
    L.push("     COLORS — SEMANTIC ROLES");
    L.push("     ════════════════════════════════════════════════════════════════ */");
    L.push("");
    for (const s of semantic) {
      L.push(`  --color-${s.token}: var(${s.value});`);
    }
    L.push("");

    L.push("  /* ════════════════════════════════════════════════════════════════");
    L.push("     TYPOGRAPHY");
    L.push("     ════════════════════════════════════════════════════════════════ */");
    L.push("");
    L.push("  --font-family-base: \"Poppins\", system-ui, -apple-system, \"Segoe UI\", sans-serif;");
    L.push("");
    L.push("  --font-weight-regular:   400;");
    L.push("  --font-weight-medium:    500;");
    L.push("  --font-weight-semibold:  600;");
    L.push("  --font-weight-bold:      700;");
    L.push("");
    L.push("  /* Type sizes */");
    for (const t of typeScale) {
      L.push(`  --${t.token}: ${t.rem};  /* ${t.px}px */`);
    }
    L.push("");
    L.push("  /* Numeric aliases */");
    for (const t of typeScale) {
      L.push(`  --${t.alias}: var(--${t.token});`);
    }
    L.push("");
    L.push("  /* Line heights (observed in Figma button components) */");
    L.push("  --line-height-base: 1.25rem;   /* 20px */");
    L.push("  --line-height-md:   1.5rem;    /* 24px */");
    L.push("  --line-height-lg:   1.75rem;   /* 28px */");
    L.push("");

    L.push("  /* ════════════════════════════════════════════════════════════════");
    L.push("     SPACING — ⚠️ derived 4px-base scale");
    L.push("     ════════════════════════════════════════════════════════════════ */");
    L.push("");
    for (const s of spacing) {
      L.push(`  --${s.token}: ${s.rem === "0" ? "0" : s.rem};  /* ${s.px}px */`);
    }
    L.push("");

    L.push("  /* ════════════════════════════════════════════════════════════════");
    L.push("     SIZING — ⚠️ derived");
    L.push("     ════════════════════════════════════════════════════════════════ */");
    L.push("");
    for (const s of sizing) {
      L.push(`  --${s.token}: ${s.rem};  /* ${s.px}px — ${s.note} */`);
    }
    L.push("");

    L.push("  /* ════════════════════════════════════════════════════════════════");
    L.push("     BORDER RADIUS");
    L.push("     ════════════════════════════════════════════════════════════════ */");
    L.push("");
    for (const r of radius) {
      const v = r.px === 1000 ? "1000px" : (r.px === 0 ? "0" : `${r.px}px`);
      L.push(`  --${r.token}: ${v};${r.note ? `  /* ${r.note} */` : ""}`);
    }
    L.push("");

    L.push("  /* ════════════════════════════════════════════════════════════════");
    L.push("     BORDER WIDTH");
    L.push("     ════════════════════════════════════════════════════════════════ */");
    L.push("");
    for (const b of border) {
      const v = b.px === 0 ? "0" : `${b.px}px`;
      L.push(`  --${b.token}: ${v};${b.note ? `  /* ${b.note} */` : ""}`);
    }
    L.push("");

    L.push("  /* ════════════════════════════════════════════════════════════════");
    L.push("     ELEVATION (observed)");
    L.push("     ════════════════════════════════════════════════════════════════ */");
    L.push("");
    L.push("  --shadow-button: 1px 1px 4px 0 rgba(23, 23, 23, 0.4);");
    L.push("}");
    L.push("");

    return L.join("\n");
  }

  function downloadText(filename, content, mime = "text/plain;charset=utf-8") {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  window.DSExport = { renderMarkdown, renderTokensCss, downloadText };
})();

  <script type="text/babel">
/* eslint-disable */
// Platform + Theme architecture for Purple Ice — v0.3
// Adds: ThemeProvider, PlatformSwitcher (topbar UI), and the new
// Foundations / Platforms / Governance sections.
// Loaded after ds-data.jsx but before ds-app.jsx.

const { useState: useStateP, useEffect: useEffectP, useContext: useContextP, createContext, useCallback: useCallbackP, useMemo: useMemoP } = React;

const {
  PLATFORMS,
  ELEVATION_SCALE,
  MOTION_DURATIONS,
  MOTION_EASINGS,
  Z_INDEX_SCALE,
  SURFACE_TOKENS,
  SURFACE_STACKS,
  GRID_BREAKPOINTS,
} = window.DSData;

/* ─── Theme + Platform Context ─────────────────────────────────── */

const THEME_STORAGE_KEY = "purple-ice-theme-v3";
const DEFAULT_THEME = { platform: "student", theme: "light" };

function loadThemePref() {
  try {
    const raw = localStorage.getItem(THEME_STORAGE_KEY);
    if (!raw) return { ...DEFAULT_THEME };
    const parsed = JSON.parse(raw);
    return { ...DEFAULT_THEME, ...(typeof parsed === "object" && parsed ? parsed : {}) };
  } catch (e) { return { ...DEFAULT_THEME }; }
}

function persistThemePref(t) {
  try { localStorage.setItem(THEME_STORAGE_KEY, JSON.stringify(t)); } catch (e) {}
}

const PlatformCtx = createContext({
  platform: "student",
  theme: "light",
  setPlatform: () => {},
  setTheme: () => {},
});

function PlatformProvider({ children }) {
  const [state, setState] = useStateP(loadThemePref);

  // Apply to documentElement
  useEffectP(() => {
    document.documentElement.setAttribute("data-theme", state.theme);
    document.documentElement.setAttribute("data-platform", state.platform);
  }, [state.theme, state.platform]);

  const setPlatform = useCallbackP((platformId) => {
    const platform = PLATFORMS.find(p => p.id === platformId);
    setState(prev => {
      // Auto-pair: switching to a dark-default platform flips the theme,
      // unless the user has explicitly chosen otherwise on this session.
      const nextTheme = platform ? platform.theme : prev.theme;
      const next = { ...prev, platform: platformId, theme: nextTheme };
      persistThemePref(next);
      return next;
    });
  }, []);

  const setTheme = useCallbackP((theme) => {
    setState(prev => {
      const next = { ...prev, theme };
      persistThemePref(next);
      return next;
    });
  }, []);

  const value = useMemoP(() => ({
    platform: state.platform,
    theme: state.theme,
    setPlatform,
    setTheme,
  }), [state.platform, state.theme, setPlatform, setTheme]);

  return <PlatformCtx.Provider value={value}>{children}</PlatformCtx.Provider>;
}

function usePlatform() { return useContextP(PlatformCtx); }

/* ─── Platform Switcher (lives in TopBar) ──────────────────────── */

function PlatformSwitcher() {

// Convert a cubic-bezier(x1,y1,x2,y2) string into a tiny SVG path
function easingPath(curve) {
  const m = curve.match(/cubic-bezier\(([^)]+)\)/);
  if (!m) {
    // linear
    return "M 10 50 L 90 10";
  }
  const [x1, y1, x2, y2] = m[1].split(",").map(s => parseFloat(s.trim()));
  // Map (0..1, 0..1) into (10..90, 50..10) — y inverted
  const sx = (v) => 10 + v * 80;
  const sy = (v) => 50 - v * 40;
  return `M ${sx(0)} ${sy(0)} C ${sx(x1)} ${sy(y1)}, ${sx(x2)} ${sy(y2)}, ${sx(1)} ${sy(1)}`;
}

function GovernanceSection({ Section, SubGroup }) {
  return (
    <Section
      id="governance"
      eyebrow="Governance"
      title="Governance"
      lede="How this system grows. Rules for contribution, naming, and adding new tokens. Optimised so a future Claude session — or a new team member — can extend safely."
    >
      <SubGroup title="The 80 / 20 rule" subtitle="The single most important guideline.">
        <div className="rule-card">
          <p>
            <strong>Adhere to the existing system 80% of the time.</strong> Use the defined tokens —
            colors, type, spacing, sizing, radius, motion, elevation — for anything they cover.
          </p>
          <p>
            <strong>20% flexibility</strong> only when the system genuinely doesn't cover a need. When you
            introduce a new value, flag it explicitly so the design owner can decide whether to promote
            it into the system:
          </p>
          <pre className="rule-card__flag">⚠️ New token introduced: <code>color-x-y</code> — reason: [why]</pre>
          <p>Never silently invent colors, sizes, or spacing values that conflict with the scale.</p>
        </div>
      </SubGroup>

      <SubGroup title="Before creating anything" subtitle="The order of operations matters.">
        <ol className="step-list">
          <li><strong>Search</strong> — existing component? variant? composable primitive?</li>
          <li><strong>Reuse</strong> — tokens and interactions, not just visuals</li>
          <li><strong>Extend</strong> — add a variant before a new component</li>
          <li><strong>Refactor</strong> — only when inconsistency hurts scalability</li>
          <li><strong>Create</strong> — last resort. If new, define states, accessibility, responsive behaviour, and platform compatibility upfront.</li>
        </ol>
      </SubGroup>

      <SubGroup title="Naming conventions" subtitle="Semantic, scalable, theme-friendly.">
        <div className="naming-grid">
          <div className="naming-card">
            <h4>Colors</h4>
            <code>--color-&lt;ramp&gt;-&lt;stop&gt;</code>
            <code>--color-&lt;role&gt;-&lt;variant&gt;</code>
            <p>Raw: <code>--color-purple-800</code>. Semantic: <code>--color-text-primary</code>, <code>--color-surface-elevated</code>. Use semantic in product code, raw only in tokens.</p>
          </div>
          <div className="naming-card">
            <h4>Spacing</h4>
            <code>--space-&lt;n&gt;</code>
            <p>4px-base scale. n is the value in 4px units (mostly). <code>--space-4</code> = 16px.</p>
          </div>
          <div className="naming-card">
            <h4>Sizing</h4>
            <code>--size-&lt;family&gt;-&lt;t-shirt&gt;</code>
            <p>e.g. <code>--size-icon-md</code>, <code>--size-control-lg</code>. T-shirt sizes when scale is short; numeric when scale is long.</p>
          </div>
          <div className="naming-card">
            <h4>Components</h4>
            <code>--&lt;component&gt;-&lt;size&gt;-&lt;prop&gt;</code>
            <p>e.g. <code>--btn-medium-pad-y</code>. Always start with the component name so search-and-discover works.</p>
          </div>
        </div>
      </SubGroup>

      <SubGroup title="Token guidelines" subtitle="When to promote a new token into the system.">
        <ul className="check-list">
          <li>✅ <strong>Promote</strong> when the value is reused 3+ times across distinct components</li>
          <li>✅ <strong>Promote</strong> when it represents a semantic concept (e.g. <code>surface-elevated</code>)</li>
          <li>✅ <strong>Promote</strong> when product confirms the value is part of the system</li>
          <li>❌ <strong>Don't</strong> promote one-off marketing/illustration values — keep them inline</li>
          <li>❌ <strong>Don't</strong> add aliases just for convenience — they add noise</li>
        </ul>
      </SubGroup>

      <SubGroup title="Variant guidelines" subtitle="Prefer variants over net-new components.">
        <p className="prose">
          A button with an icon is not a new component — it's a variant. A dropdown showing avatars is
          not a new component — it's a variant. Net-new components are reserved for genuinely new
          behaviour (e.g. there is no Toast yet; that is a real new component).
        </p>
        <p className="prose">
          When a variant exists, encode the differentiator in the variant name:
          <code>Type=Primary, Size=Medium, Theme=Dark</code> (Figma-style). In code, expose it as a prop
          rather than a separate component.
        </p>
      </SubGroup>

      <SubGroup title="When to refactor" subtitle="Optional, never reflex.">
        <div className="rule-card">
          <p><strong>Refactor when:</strong></p>
          <ul className="check-list check-list--tight">
            <li>Inconsistency breaks scalability (e.g. duplicate tokens, drifting button heights)</li>
            <li>Accessibility is poor and can't be fixed in a leaf</li>
            <li>Architecture has become fragile (e.g. circular semantic aliases)</li>
          </ul>
          <p><strong>Don't refactor</strong> purely for visual preference. The 80/20 rule applies to refactoring as much as to creation.</p>
        </div>
      </SubGroup>
    </Section>
  );
}

function rgbFromHex(hex) {
  if (!hex) return null;
  const h = hex.replace("#", "");
  const r = parseInt(h.slice(0, 2), 16);
  const g = parseInt(h.slice(2, 4), 16);
  const b = parseInt(h.slice(4, 6), 16);
  return [r, g, b];
}

function isLight(hex) {
  const rgb = rgbFromHex(hex);
  if (!rgb) return true;
  const [r, g, b] = rgb;
  // perceptual luminance
  return (0.299 * r + 0.587 * g + 0.114 * b) > 165;
}

const ToastCtx = React.createContext(() => {});
const EditModeCtx = React.createContext(false);

function useCopy() {
  const toast = React.useContext(ToastCtx);
  return useCallback((text, label) => {
    if (!text) return;
    try {
      navigator.clipboard.writeText(text);
      toast(label ? `Copied ${label}` : `Copied ${text}`);
    } catch (e) {
      toast("Copy failed");

  }, [toast]);
}

};
function loadTweaks() {

    const parsed = JSON.parse(raw);
    return { ...DEFAULT_TWEAKS, ...(typeof parsed === "object" && parsed ? parsed : {}) };
  } catch (e) { return { ...DEFAULT_TWEAKS }; }
}

      lede={editMode

            <ColorRamp
              group={group}

function BaseColorRow({ stops }) {
  const copy = useCopy();
  return (
    <div className="base-row">

          key={s.token}
          type="button"

          <span className="base-swatch__hex">{s.hex}</span>
        </button>
      ))}

}

function ColorRamp({ group, onRename, onReorder, onDelete, onSetField }) {
  const [dragOrigToken, setDragOrigToken] = useState(null);
  const [dropTarget, setDropTarget] = useState(null); // { origToken, side: 'before'|'after' }

  const handleDrop = useCallback(() => {
    if (!dragOrigToken || !dropTarget) {
      setDragOrigToken(null);
      setDropTarget(null);
      return;
    }
    const currentOrder = group.stops.map(s => s._origToken);
    const fromIdx = currentOrder.indexOf(dragOrigToken);
    if (fromIdx === -1) return;
    const without = currentOrder.filter(t => t !== dragOrigToken);
    let toIdx = without.indexOf(dropTarget.origToken);
    if (toIdx === -1) toIdx = without.length;
    if (dropTarget.side === "after") toIdx += 1;
    const next = [...without];
    next.splice(toIdx, 0, dragOrigToken);
    onReorder(next);
    setDragOrigToken(null);
    setDropTarget(null);
  }, [dragOrigToken, dropTarget, group.stops, onReorder]);

  return (
    <div className="ramp" onDragOver={(e) => e.preventDefault()}>
      {group.stops.map(s => (
        <Swatch
          key={s._origToken}
          stop={s}
          isDragging={dragOrigToken === s._origToken}
          dropSide={dropTarget && dropTarget.origToken === s._origToken ? dropTarget.side : null}
          onDragStart={() => setDragOrigToken(s._origToken)}
          onDragEnd={() => { setDragOrigToken(null); setDropTarget(null); }}
          onDragOverSelf={(side) => {
            if (!dragOrigToken || dragOrigToken === s._origToken) return;
            setDropTarget({ origToken: s._origToken, side });
          }}
          onDropSelf={handleDrop}
          onRename={(next) => onRename(s._origToken, next)}
          onDelete={() => onDelete(s._origToken)}
          onSetField={(field, value) => onSetField(s._origToken, field, value)}
        />
      ))}
    </div>
  );
}

function Swatch({ stop, isDragging, dropSide, onDragStart, onDragEnd, onDragOverSelf, onDropSelf, onRename, onDelete, onSetField }) {
  const copy = useCopy();
  const editMode = React.useContext(EditModeCtx);
  const [editing, setEditing] = useState(false);
  const [tokenDraft, setTokenDraft] = useState(stop.token);
  const [hexDraft, setHexDraft] = useState(stop.hex || "");
  const [figmaDraft, setFigmaDraft] = useState(stop.figma || "");
  const tokenInputRef = useRef(null);
  const hexInputRef = useRef(null);

  useEffect(() => { setTokenDraft(stop.token); }, [stop.token]);
  useEffect(() => { setHexDraft(stop.hex || ""); }, [stop.hex]);
  useEffect(() => { setFigmaDraft(stop.figma || ""); }, [stop.figma]);
  useEffect(() => {
    if (!editing) return;
    // For gap stops, focus the hex field (that's the field that fills them).
    const target = stop.gap ? hexInputRef.current : tokenInputRef.current;
    if (target) { target.focus(); target.select(); }
  }, [editing, stop.gap]);

  // Normalise hex input — accept with or without #, validate 3 or 6 hex chars
  const normalisedHex = (raw) => {
    const v = (raw || "").trim().replace(/^#/, "").toUpperCase();
    if (!v) return "";
    if (/^[0-9A-F]{3}$/.test(v)) {
      // expand short form
      return "#" + v.split("").map(c => c + c).join("");
    }
    if (/^[0-9A-F]{6}$/.test(v)) return "#" + v;
    return null; // invalid
  };

  const commit = () => {
    // Token
    const cleanedToken = tokenDraft.replace(/^--color-/, "").trim();
    if (cleanedToken && cleanedToken !== stop.token) onRename(cleanedToken);
    // Hex
    const normHex = normalisedHex(hexDraft);
    if (normHex !== null && normHex !== (stop.hex || "")) {
      onSetField("hex", normHex);
    }
    // Figma name
    const cleanedFigma = figmaDraft.trim();
    if (cleanedFigma !== (stop.figma || "")) {
      onSetField("figma", cleanedFigma);
    }
    setEditing(false);
  };
  const cancel = () => {
    setTokenDraft(stop.token);
    setHexDraft(stop.hex || "");
    setFigmaDraft(stop.figma || "");
    setEditing(false);
  };

  const isGap = !!stop.gap;
  const hexValid = !hexDraft || normalisedHex(hexDraft) !== null;
  const wasFilled = stop._wasGap && !isGap;

  const classes = [
    "swatch",
    isGap && "swatch--gap",
    stop.anchor && "swatch--anchor",
    stop._renamed && "swatch--renamed",
    wasFilled && "swatch--filled",
    isDragging && "swatch--dragging",
    dropSide && `swatch--drop-${dropSide}`,
    editing && "swatch--editing",
  ].filter(Boolean).join(" ");

  return (
    <div
      className={classes}
      onDragOver={(e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        const rect = e.currentTarget.getBoundingClientRect();
        const side = (e.clientX - rect.left) < rect.width / 2 ? "before" : "after";
        onDragOverSelf(side);
      }}
      onDrop={(e) => { e.preventDefault(); onDropSelf(); }}
    >
      <div
        className={`swatch__chip ${isGap ? "swatch__chip--gap" : ""}`}
        style={isGap ? undefined : { background: stop.hex }}
      >
        {isGap ? (
          editMode ? (
            <button
              type="button"
              className="swatch__chip-fill"
              onClick={() => setEditing(true)}
              aria-label="Fill this gap — add hex value"
              title="Click to add a hex value"
            >
              <span className="swatch__chip-gap-mark">+ add hex</span>
            </button>
          ) : (
            <span className="swatch__chip-gap-mark">gap</span>
          )
        ) : (
          <button
            type="button"
            className="swatch__chip-copy"
            onClick={() => copy(stop.hex, stop.hex)}
            aria-label={`Copy ${stop.hex}`}
          />
        )}
        {editMode && (
          <div className="swatch__chip-actions">
            <button
              type="button"
              className="swatch__action swatch__action--drag"
              draggable
              onDragStart={(e) => {
                e.dataTransfer.effectAllowed = "move";
                e.dataTransfer.setData("text/plain", stop._origToken);
                onDragStart();
              }}
              onDragEnd={onDragEnd}
              title="Drag to reorder within band"
              aria-label="Drag to reorder"
            >
              <DragIcon />
            </button>
            <button
              type="button"
              className="swatch__action swatch__action--edit"
              onClick={() => setEditing(true)}
              title="Edit all fields"
              aria-label="Edit all fields"
            >
              <PencilIcon />
            </button>
            <button
              type="button"
              className="swatch__action swatch__action--delete"
              onClick={onDelete}
              title="Delete this stop"
              aria-label="Delete this stop"
            >
              <TrashIcon />
            </button>
          </div>
        )}
        {stop.anchor && <span className="swatch__anchor-flag">★</span>}
      </div>
      <div className="swatch__body">
        {editing ? (
          <form
            className="swatch__edit"
            onSubmit={(e) => { e.preventDefault(); if (hexValid) commit(); }}
          >
            <label className="swatch__edit-row">
              <span className="swatch__edit-label">Token</span>
              <span className="swatch__edit-field">
                <span className="swatch__edit-prefix">--color-</span>
                <input
                  ref={tokenInputRef}
                  className="swatch__edit-input"
                  value={tokenDraft}
                  onChange={(e) => setTokenDraft(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Escape") cancel(); }}
                  spellCheck={false}
                  placeholder="name"
                />
              </span>
            </label>
            <label className="swatch__edit-row">
              <span className="swatch__edit-label">Hex</span>
              <span className="swatch__edit-field">
                <input
                  ref={hexInputRef}
                  type="color"
                  className="swatch__edit-color"
                  value={normalisedHex(hexDraft) || "#cccccc"}
                  onChange={(e) => setHexDraft(e.target.value)}
                  aria-label="Pick hex value"
                />
                <input
                  className={`swatch__edit-input ${!hexValid ? "swatch__edit-input--invalid" : ""}`}
                  value={hexDraft}
                  onChange={(e) => setHexDraft(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Escape") cancel(); }}
                  spellCheck={false}
                  placeholder={isGap ? "#000000 (required to fill)" : "#000000"}
                />
              </span>
            </label>
            <label className="swatch__edit-row">
              <span className="swatch__edit-label">Figma</span>
              <span className="swatch__edit-field">
                <input
                  className="swatch__edit-input"
                  value={figmaDraft}
                  onChange={(e) => setFigmaDraft(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Escape") cancel(); }}
                  spellCheck={false}
                  placeholder="Figma reference"
                />
              </span>
            </label>
            {!hexValid && (
              <span className="swatch__edit-err">Enter 3 or 6 hex chars (e.g. #5F4DC7)</span>
            )}
            <div className="swatch__edit-actions">
              <button type="submit" className="swatch__edit-save" disabled={!hexValid}>Save</button>
              <button type="button" className="swatch__edit-cancel" onClick={cancel}>Cancel</button>
            </div>
          </form>
        ) : (
          <button
            type="button"
            className="swatch__token swatch__token--btn"
            onClick={() => copy(`var(--color-${stop.token})`, `--color-${stop.token}`)}
            title="Copy CSS variable"
          >
            --color-{stop.token}
          </button>
        )}
        {!editing && (
          isGap ? (
            editMode ? (
              <button
                type="button"
                className="swatch__hex swatch__hex--muted swatch__hex--btn"
                onClick={() => setEditing(true)}
                title="Add a hex value"
              >
                gap · click to add hex
              </button>
            ) : (
              <span className="swatch__hex swatch__hex--muted">gap — not defined</span>
            )
          ) : (
            <button
              type="button"
              className="swatch__hex swatch__hex--btn"
              onClick={() => copy(stop.hex, stop.hex)}
              title="Copy hex"
            >
              {stop.hex}
            </button>
          )
        )}
        {!editing && <span className="swatch__figma">{stop.figma}</span>}
        {stop._renamed && (
          <span className="swatch__renamed">↺ was <code>--color-{stop._origToken}</code></span>
        )}
        {wasFilled && !stop._renamed && (
          <span className="swatch__renamed">✨ filled (was a gap)</span>
        )}
        {stop.warn && !stop._renamed && !wasFilled && <span className="swatch__warn">⚠️ {stop.warn}</span>}
      </div>
    </div>
  );
}

              return (
                <div key={state.id} className="btn-matrix__cell">
                  <PreviewButton
                    color={color}
                    type={type.id}
                    state={state}
                    spec={spec}
                    sizeSpec={sizeSpec}
                    tweaks={tweaks}
                  />

        ))}
      </div>

function tokenVar(token) {
  return token ? `var(--color-${token})` : null;
}

function PreviewButton({ color, type, state, spec, sizeSpec, tweaks }) {
  const copy = useCopy();
  const isIconOnly = tweaks.iconOnly;
  const radius = color.radius[sizeSpec.id];
  const showShadow = spec.shadow && type !== "tertiary";
  const isFocussed = state.id === "focussed";

  const ring = isFocussed ? tokenVar(spec.ring) : null;

  // For focus state we use a 4px outer ring via box-shadow — matches Figma's
  // 4px border treatment without changing the button's box size.
  const shadows = [];
  if (showShadow === "drop") shadows.push("1px 1px 4px 0 rgba(23,23,23,0.4)");
  if (showShadow === "inset") shadows.push("inset 0 0 4px 0 rgba(0,0,0,0.25)");
  if (ring) shadows.push(`0 0 0 4px ${ring}`);

  const btnStyle = {
    height: sizeSpec.height,
    padding: type === "tertiary" ? 0 : `${sizeSpec.padY}px ${sizeSpec.padX}px`,
    borderRadius: radius,
    background: spec.gradient
      ? `linear-gradient(${tokenVar(spec.gradient[0])}, ${tokenVar(spec.gradient[1])})`
      : (tokenVar(spec.bg) || "transparent"),
    color: tokenVar(spec.text),
    border: spec.border ? `1px solid ${tokenVar(spec.border)}` : "none",
    fontSize: sizeSpec.font,
    lineHeight: `${sizeSpec.lineH}px`,
    boxShadow: shadows.length ? shadows.join(", ") : "none",
    minWidth: isIconOnly ? sizeSpec.height : undefined,
    width: isIconOnly ? sizeSpec.height : undefined,
    cursor: state.id === "disabled" ? "not-allowed" : "pointer",
  };

  const tokenSummary = [
    spec.gradient ? `gradient:${spec.gradient.join("→")}` : `bg:${spec.bg || "transparent"}`,
    `text:${spec.text}`,
    spec.border && `border:${spec.border}`,
    spec.ring && `ring:${spec.ring}`,
  ].filter(Boolean).join(" · ");

  const labelText = state.id === "disabled" || isIconOnly ? tweaks.label : tweaks.label;

  return (
    <div className="btn-preview">
      <button
        type="button"
        className={`pb pb--${type} pb--${state.id} ${isIconOnly ? "pb--icon-only" : ""}`}
        style={btnStyle}
        disabled={state.id === "disabled"}
        onClick={() => copy(tokenSummary, `${color.name} · ${type} · ${state.name}`)}
        title={`Copy spec: ${tokenSummary}`}
      >
        {(!isIconOnly && tweaks.leadingIcon && tweaks.leadingIcon !== ICON_NONE) && (
          <ButtonIcon name={tweaks.leadingIcon} size={sizeSpec.icon} />
        )}
        {isIconOnly ? (
          <ButtonIcon name={tweaks.leadingIcon === ICON_NONE ? "home" : tweaks.leadingIcon} size={sizeSpec.icon} />
        ) : (
          <span className="pb__label">{labelText}</span>
        )}
        {(!isIconOnly && tweaks.trailingIcon && tweaks.trailingIcon !== ICON_NONE) && (
          <ButtonIcon name={tweaks.trailingIcon} size={sizeSpec.icon} />
        )}
      </button>
    </div>
  );
}

        </div>

    </div>
  );
}

  top: "/", intro: "/",

  radius: "/foundations/radius", surfaces: "/foundations/surfaces",

};

function parseHash() {
  let h = (window.location.hash || "").replace(/^#/, "");
  if (!h) return "/";
  if (!h.startsWith("/")) return LEGACY_ANCHORS[h] || "/";
  if (h.length > 1 && h.endsWith("/")) h = h.slice(0, -1);
  return ROUTE_BY_PATH[h] ? h : "/";
}

/* ─── Search index ──────────────────────────────────────────────── */

function buildSearchIndex() {
  const pages = SITE_ROUTES
    .filter(r => r.path !== "/")
    .map(r => ({
      type: "page",
      label: r.label,
      meta: r.groupLabel || "Section",
      route: r.path,
    }));

  const tokens = [];
  const push = (label, meta, route, hex) => tokens.push({ type: "token", label, meta, route, hex });

  ShData.BASE_COLORS.forEach(s => push(`--color-${s.token}`, s.hex, "/foundations/colors", s.hex));
  ShData.COLOR_GROUPS.forEach(g =>
    g.stops.forEach(s => { if (!s.gap) push(`--color-${s.token}`, s.hex, "/foundations/colors", s.hex); })
  );
  ShData.SEMANTIC_COLORS.forEach(s => push(`--color-${s.token}`, s.hex, "/foundations/colors", s.hex));
  ShData.FONT_WEIGHTS.forEach(w => push(`--${w.token}`, String(w.value), "/foundations/type"));
  ShData.TYPE_SCALE.forEach(t => push(`--${t.token}`, `${t.px}px`, "/foundations/type"));
  ShData.SPACING_SCALE.forEach(s => push(`--${s.token}`, `${s.px}px`, "/foundations/spacing"));
  ShData.SIZING_SCALE.forEach(s => push(`--${s.token}`, `${s.px}px`, "/foundations/sizing"));
  ShData.RADIUS_SCALE.forEach(r => push(`--${r.token}`, `${r.px}px`, "/foundations/radius"));
  ShData.BORDER_WIDTH_SCALE.forEach(b => push(`--${b.token}`, `${b.px}px`, "/foundations/radius"));
  ShData.SURFACE_TOKENS.forEach(s => push(`--color-${s.token}`, s.light, "/foundations/surfaces", s.light));
  ShData.ELEVATION_SCALE.forEach(e => push(`--${e.token}`, `level ${e.level}`, "/foundations/elevation"));
  ShData.MOTION_DURATIONS.forEach(d => push(`--${d.token}`, `${d.ms}ms`, "/foundations/motion"));
  ShData.MOTION_EASINGS.forEach(e => push(`--${e.token}`, e.curve, "/foundations/motion"));
  ShData.Z_INDEX_SCALE.forEach(z => push(`--${z.token}`, String(z.value), "/foundations/z-index"));

  return { pages, tokens };
}

/* ─── Search modal ──────────────────────────────────────────────── */

function SearchModal({ onClose, onNavigate }) {
  const [query, setQuery] = useStateSh("");
  const [sel, setSel] = useStateSh(0);
  const inputRef = useRefSh(null);
  const index = useMemoSh(buildSearchIndex, []);

  useEffectSh(() => { if (inputRef.current) inputRef.current.focus(); }, []);

  const results = useMemoSh(() => {
    const q = query.trim().toLowerCase();
    if (!q) return { pages: index.pages.slice(0, 8), tokens: [] };
    const pages = index.pages.filter(p => p.label.toLowerCase().includes(q) || p.meta.toLowerCase().includes(q)).slice(0, 6);
    const tokens = index.tokens.filter(t => t.label.toLowerCase().includes(q) || (t.meta || "").toLowerCase().includes(q)).slice(0, 12);
    return { pages, tokens };
  }, [query, index]);

  const flat = useMemoSh(() => [...results.pages, ...results.tokens], [results]);

  useEffectSh(() => { setSel(0); }, [query]);

  const choose = useCallbackSh((item) => {
    if (!item) return;
    onNavigate(item.route);
    onClose();
  }, [onNavigate, onClose]);

  const onKeyDown = (e) => {
    if (e.key === "Escape") { e.preventDefault(); onClose(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); setSel(s => Math.min(s + 1, flat.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setSel(s => Math.max(s - 1, 0)); }
    else if (e.key === "Enter") { e.preventDefault(); choose(flat[sel]); }
  };

  const renderItem = (item, i) => (
    <button
      key={`${item.type}-${item.label}-${i}`}
      type="button"
      className={`st-search__item ${i === sel ? "is-selected" : ""}`}
      onMouseEnter={() => setSel(i)}
      onClick={() => choose(item)}
    >
      {item.hex && <span className="st-search__item-chip" style={{ background: item.hex }}></span>}
      <span className={`st-search__item-label ${item.type === "token" ? "st-search__item-label--mono" : ""}`}>{item.label}</span>
      <span className="st-search__item-meta">{item.meta}</span>
    </button>
  );

  return (
    <div className="st-search-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="st-search" role="dialog" aria-label="Search the design system" onKeyDown={onKeyDown}>
        <div className="st-search__row">
          <SearchIcon />
          <input
            ref={inputRef}
            className="st-search__input"
            placeholder="Search pages and tokens…"
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            spellCheck={false}
          />
          <span className="st-search__esc">esc</span>
        </div>
        <div className="st-search__results">
          {results.pages.length > 0 && (
            <React.Fragment>
              <div className="st-search__group-label">Pages</div>
              {results.pages.map((p, i) => renderItem(p, i))}
            </React.Fragment>
          )}
          {results.tokens.length > 0 && (
            <React.Fragment>
              <div className="st-search__group-label">Tokens</div>
              {results.tokens.map((t, i) => renderItem(t, results.pages.length + i))}
            </React.Fragment>
          )}
          {flat.length === 0 && (
            <div className="st-search__empty">No matches for “{query}”</div>
          )}
        </div>
        <div className="st-search__hints">
          <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
          <span><kbd>↵</kbd> open</span>
          <span><kbd>esc</kbd> close</span>
        </div>
      </div>
    </div>
  );
}

function routeNeighbors(path) {
  const i = SITE_ROUTES.findIndex(r => r.path === path);

    prev: i > 0 ? SITE_ROUTES[i - 1] : null,
    next: i >= 0 && i < SITE_ROUTES.length - 1 ? SITE_ROUTES[i + 1] : null,
  };
}

function PageShell({ route, children }) {

    <div className="page page--doc" data-screen-label={route.label}>

        {route.src && (
          <div className="st-pagefoot__source">
            <span>Source of truth:</span>
            {route.src.map(f => (
              <a key={f} href={f} target="_blank" rel="noopener">{f}</a>
            ))}
          </div>
        )}
        <div className="st-pagefoot__nav">
          {prev && (
            <a className="st-pagefoot__link st-pagefoot__link--prev" href={`#${prev.path}`}>
              <span className="st-pagefoot__link-dir">← Previous</span>
              <span className="st-pagefoot__link-title">{prev.label}</span>
            </a>
          )}
          {next && (
            <a className="st-pagefoot__link st-pagefoot__link--next" href={`#${next.path}`}>
              <span className="st-pagefoot__link-dir">Next →</span>
              <span className="st-pagefoot__link-title">{next.label}</span>
            </a>
          )}
        </div>
      </div>
    </div>
  );
}

/* ─── Route → content ───────────────────────────────────────────── */

function RouteContent({ path, tweaks }) {
  const W = window;
  switch (path) {
    case "/foundations":           return <W.FoundationsIndex />;
    case "/foundations/colors":    return <W.ColorsSection />;
    case "/foundations/type":      return <W.TypographySection />;
    case "/foundations/spacing":   return <W.SpacingSection />;
    case "/foundations/sizing":    return <W.SizingSection />;
    case "/foundations/radius":    return <W.RadiusBorderSection />;
    case "/foundations/surfaces":  return <W.SurfacesSection Section={ShSection} SubGroup={ShSubGroup} useCopyFn={shUseCopy} />;
    case "/foundations/grids":     return <W.GridsSection Section={ShSection} SubGroup={ShSubGroup} useCopyFn={shUseCopy} />;
    case "/foundations/elevation": return <W.ElevationSection Section={ShSection} useCopyFn={shUseCopy} />;
    case "/foundations/motion":    return <W.MotionSection Section={ShSection} SubGroup={ShSubGroup} useCopyFn={shUseCopy} />;
    case "/foundations/z-index":   return <W.ZIndexSection Section={ShSection} useCopyFn={shUseCopy} />;
    case "/components":            return <W.ComponentsIndex />;
    case "/components/buttons":    return <W.ButtonsSection tweaks={tweaks} />;
    case "/components/fields":     return <W.FieldsSection Section={ShSection} SubGroup={ShSubGroup} useCopyFn={shUseCopy} />;
    case "/components/chips":      return <W.ChipsSection Section={ShSection} SubGroup={ShSubGroup} useCopyFn={shUseCopy} />;
    case "/components/tables":     return <W.TablesSection Section={ShSection} SubGroup={ShSubGroup} useCopyFn={shUseCopy} />;
    case "/platforms":             return <W.PlatformsSection Section={ShSection} SubGroup={ShSubGroup} />;
    case "/governance":            return <W.GovernanceSection Section={ShSection} SubGroup={ShSubGroup} />;
    case "/reference/css":         return <W.CssVariablesSection />;
    case "/reference/ai-memory":   return <W.AIMemorySection Section={ShSection} />;
    case "/reference/changelog":   return <W.ChangelogPage />;
    default:                       return <W.HomePage />;
  }
}

/* ─── Site footer ───────────────────────────────────────────────── */

function SiteFooter() {
  return (
    <footer className="st-footer">
      <span>Purple Ice · V1 · Foundations + Buttons + Fields + Chips + Tables + Multi-platform</span>
      <span>Coming next: Checkboxes/Radios → Dropdowns → Tooltips → Toasts</span>
    </footer>
  );
}

/* ─── App ───────────────────────────────────────────────────────── */

const EDIT_MODE_KEY = "purple-ice-edit-mode-v1";

function SiteApp() {
  const [path, setPath] = useStateSh(parseHash);
  const [toast, setToast] = useStateSh(null);
  const toastTimer = useRefSh();
  const [tweaks, setTweaks] = useStateSh(DSTweaks.load);
  const [tweaksOpen, setTweaksOpen] = useStateSh(false);
  const [searchOpen, setSearchOpen] = useStateSh(false);
  const [navOpen, setNavOpen] = useStateSh(false);
  const [editMode, setEditMode] = useStateSh(() => {
    try { return localStorage.getItem(EDIT_MODE_KEY) === "1"; } catch (e) { return false; }
  });

  // Routing
  useEffectSh(() => {
    const onHash = () => setPath(parseHash());
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  useEffectSh(() => {
    window.scrollTo(0, 0);
    setNavOpen(false);
    const route = ROUTE_BY_PATH[path];
    document.title = route && route.path !== "/"
      ? `${route.label} · Purple Ice V1`
      : "Purple Ice · Unified Design System V1";
  }, [path]);

  // Toast
  const showToast = useCallbackSh((msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 1800);
  }, []);

  // Tweaks host protocol
  useEffectSh(() => {
    function onMsg(e) {
      if (!e.data || typeof e.data !== "object") return;
      if (e.data.type === "__activate_edit_mode") setTweaksOpen(true);
      else if (e.data.type === "__deactivate_edit_mode") setTweaksOpen(false);
    }
    window.addEventListener("message", onMsg);
    try { window.parent.postMessage({ type: "__edit_mode_available" }, "*"); } catch (e) {}
    return () => window.removeEventListener("message", onMsg);
  }, []);

  const setTweak = useCallbackSh((patch) => {
    setTweaks(prev => {
      const next = { ...prev, ...patch };
      DSTweaks.persist(next);
      return next;
    });
  }, []);

  // Owner edit mode
  useEffectSh(() => {
    document.body.classList.toggle("ds-editing", editMode);
    try { localStorage.setItem(EDIT_MODE_KEY, editMode ? "1" : "0"); } catch (e) {}
  }, [editMode]);

  const toggleEdit = useCallbackSh(() => {
    setEditMode(prev => {
      const next = !prev;
      showToast(next ? "Edit mode on — token editing unlocked" : "Edit mode off");
      return next;
    });
  }, [showToast]);

  // Global keyboard shortcuts
  useEffectSh(() => {
    function onKey(e) {
      const inField = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || "") || (e.target && e.target.isContentEditable);
      if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) {
        e.preventDefault();
        setSearchOpen(o => !o);
      } else if (e.key === "/" && !inField) {
        e.preventDefault();
        setSearchOpen(true);
      }
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const navigate = useCallbackSh((route) => {
    window.location.hash = route;
  }, []);

  const route = ROUTE_BY_PATH[path] || ROUTE_BY_PATH["/"];
  const isHome = route.path === "/";

  return (
    <ShToastCtx.Provider value={showToast}>
      <ShEditModeCtx.Provider value={editMode}>
        <ShPlatformProvider>
          <div className={`st-shell ${navOpen ? "is-nav-open" : ""}`}>
            <Sidebar
              path={path}
              editMode={editMode}
              onToggleEdit={toggleEdit}
              onOpenSearch={() => setSearchOpen(true)}
            />
            {navOpen && <button type="button" className="st-scrim" aria-label="Close navigation" onClick={() => setNavOpen(false)}></button>}
            <div className="st-main">
              <ShellTopBar
                route={route}
                onOpenNav={() => setNavOpen(true)}
                onOpenSearch={() => setSearchOpen(true)}
              />
              <main className="st-content">
                {isHome
                  ? <RouteContent path={path} tweaks={tweaks} />
                  : <PageShell route={route}><RouteContent path={path} tweaks={tweaks} /></PageShell>
                }
              </main>
              <SiteFooter />
            </div>
          </div>
          {searchOpen && <SearchModal onClose={() => setSearchOpen(false)} onNavigate={navigate} />}
          {tweaksOpen && (
            <ShTweaksPanel
              tweaks={tweaks}
              setTweak={setTweak}
              onClose={() => {
                setTweaksOpen(false);
                try { window.parent.postMessage({ type: "__edit_mode_dismissed" }, "*"); } catch (e) {}
              }}
            />
          )}
        </ShPlatformProvider>
      </ShEditModeCtx.Provider>
      <ShToast message={toast} />
    </ShToastCtx.Provider>
  );
}

/* ─── Mount ─────────────────────────────────────────────────────── */

const siteRoot = ReactDOM.createRoot(document.getElementById("root"));
siteRoot.render(<SiteApp />);

  </script>
</body>
