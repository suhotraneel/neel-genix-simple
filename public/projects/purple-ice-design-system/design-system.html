<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purple Ice · Unified Design System V1</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="ds-site.css" />

  <script>
    // Persistent edits live in this JSON block. The host rewrites it on disk
    // when the page posts {type:'__edit_mode_set_keys', edits:{colorEdits:{...}}}.
    window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "colorEdits": {}
    }/*EDITMODE-END*/;
  </script>

  <style>
    /* ════════════════════════════════════════════════════════════
       PAGE STYLES — dogfoods the tokens above
       ════════════════════════════════════════════════════════════ */

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      font-family: var(--font-family-base);
      font-size: var(--text-md);
      line-height: var(--line-height-md);
      color: var(--color-text-primary);
      background: var(--color-surface-base);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      transition: background-color var(--duration-base) var(--easing-standard), color var(--duration-base) var(--easing-standard);
    }

    code, .mono { font-family: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }

    a { color: var(--color-text-link); text-decoration: none; }
    a:hover { text-decoration: underline; }

    button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--space-6) var(--space-16);
    }

    /* ── Top bar ─────────────────────────────────────────────── */

    .topbar {
      position: sticky;
      top: 0;
      z-index: var(--z-sticky);
      background: color-mix(in srgb, var(--color-surface-base) 92%, transparent);
      backdrop-filter: saturate(180%) blur(14px);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      border-bottom: var(--border-sm) solid var(--color-border-subtle);
    }
    .topbar__inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) var(--space-6);
      gap: var(--space-4);
      flex-wrap: wrap;
    }
    .topbar__main {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      flex: 1 1 auto;
      min-width: 0;
      justify-content: space-between;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--color-text-primary);
    }
    .brand:hover { text-decoration: none; }
    .brand__dot {
      width: 18px;
      height: 18px;
      border-radius: var(--radius-round);
      background: linear-gradient(135deg, var(--color-purple-800), var(--color-purple-850));
      box-shadow: 0 0 0 2px var(--color-purple-100);
    }
    .brand__name {
      font-weight: var(--font-weight-semibold);
      font-size: var(--text-md);
      letter-spacing: -0.01em;
    }
    .brand__sub {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      margin-left: var(--space-1);
    }
    .topnav {
      display: flex;
      gap: var(--space-1);
      flex-wrap: wrap;
      position: relative;
    }
    .topnav__group {
      position: relative;
    }
    .topnav__group-trigger {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-secondary);
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-6);
      transition: background 120ms ease, color 120ms ease;
      cursor: pointer;
    }
    .topnav__group-trigger:hover,
    .topnav__group.is-open .topnav__group-trigger {
      background: var(--color-purple-100);
      color: var(--color-text-brand);
    }
    .topnav__caret {
      transition: transform 120ms ease;
    }
    .topnav__group.is-open .topnav__caret {
      transform: rotate(180deg);
    }
    .topnav__menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 220px;
      background: var(--color-surface-elevated);
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-12);
      box-shadow: var(--shadow-4);
      padding: var(--space-2);
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: var(--z-dropdown);
      animation: topnav-menu-in var(--duration-base) var(--easing-emphasized);
    }
    @keyframes topnav-menu-in {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .topnav__menu-eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      padding: var(--space-1) var(--space-3) 4px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-bottom: var(--border-sm) solid var(--color-border-subtle);
      margin-bottom: 4px;
    }
    .topnav__menu-link {
      font-size: var(--text-base);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-6);
      transition: background 120ms ease, color 120ms ease;
    }
    .topnav__menu-link:hover {
      background: var(--color-purple-100);
      color: var(--color-text-brand);
      text-decoration: none;
    }

    /* ── Hero ────────────────────────────────────────────────── */

    .hero {
      padding: var(--space-16) 0 var(--space-12);
      border-bottom: var(--border-sm) solid var(--color-border-subtle);
    }
    .hero__eyebrow {
      display: inline-block;
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-text-brand);
      background: var(--color-surface-brand);
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-round);
      margin-bottom: var(--space-6);
    }
    .hero__title {
      font-size: clamp(56px, 9vw, 112px);
      line-height: 1;
      font-weight: var(--font-weight-bold);
      letter-spacing: -0.04em;
      margin: 0 0 var(--space-6);
      color: var(--color-text-primary);
    }
    .hero__title-mark { color: var(--color-purple-800); }
    .hero__lede {
      font-size: var(--text-lg);
      line-height: 1.55;
      color: var(--color-text-secondary);
      max-width: 720px;
      margin: 0 0 var(--space-8);
      text-wrap: pretty;
    }
    .hero__meta {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
    }
    .meta-pill {
      display: inline-flex;
      flex-direction: column;
      padding: var(--space-2) var(--space-4);
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-8);
      background: var(--color-surface-base);
      min-width: 140px;
    }
    .meta-pill__label {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .meta-pill__value {
      font-size: var(--text-md);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
    }

    /* ── Section frame ──────────────────────────────────────── */

    .section {
      padding: var(--space-16) 0 var(--space-12);
      border-bottom: var(--border-sm) solid var(--color-border-subtle);
    }
    .section:last-of-type { border-bottom: 0; }
    .section__header {
      margin-bottom: var(--space-10);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      max-width: 760px;
    }
    .section__eyebrow {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      letter-spacing: 0.04em;
    }
    .section__title {
      font-size: clamp(36px, 5vw, 56px);
      line-height: 1.05;
      font-weight: var(--font-weight-semibold);
      letter-spacing: -0.025em;
      margin: 0;
      color: var(--color-text-primary);
    }
    .section__lede {
      font-size: var(--text-md);
      line-height: 1.6;
      color: var(--color-text-secondary);
      margin: 0;
      max-width: 720px;
      text-wrap: pretty;
    }

    .subgroup { margin-bottom: var(--space-12); }
    .subgroup:last-child { margin-bottom: 0; }
    .subgroup__head {
      display: flex;
      align-items: baseline;
      gap: var(--space-4);
      margin-bottom: var(--space-6);
      flex-wrap: wrap;
    }
    .subgroup__title {
      font-size: var(--text-xl);
      font-weight: var(--font-weight-semibold);
      letter-spacing: -0.015em;
      margin: 0;
      color: var(--color-text-primary);
    }
    .subgroup__sub {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      margin: 0;
      flex: 1 1 240px;
      line-height: 1.5;
    }
    .role-tag {
      display: inline-block;
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-brand);
      background: var(--color-surface-brand);
      padding: 2px var(--space-2);
      border-radius: var(--radius-round);
      margin-right: var(--space-2);
    }

    /* ── Intro info cards ──────────────────────────────────── */

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: var(--space-4);
    }
    .info-card {
      padding: var(--space-6);
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-12);
      background: var(--color-surface-base);
    }
    .info-card__title {
      margin: 0 0 var(--space-4);
      font-size: var(--text-md);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
    }
    .info-card__list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .info-card__list li {
      font-size: var(--text-base);
      line-height: 1.5;
      color: var(--color-text-secondary);
      padding-left: var(--space-4);
      position: relative;
    }
    .info-card__list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 8px;
      width: 6px;
      height: 6px;
      border-radius: var(--radius-round);
      background: var(--color-purple-800);
    }

    /* ── Color ramp ─────────────────────────────────────────── */

    .base-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
    }
    .base-swatch {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: var(--space-1);
      padding: var(--space-6);
      border-radius: var(--radius-12);
      border: var(--border-sm) solid var(--color-border-subtle);
      text-align: left;
      cursor: pointer;
      transition: transform 120ms ease;
    }
    .base-swatch:hover { transform: translateY(-2px); }
    .base-swatch__token {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
    }
    .base-swatch__hex {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-md);
      opacity: 0.85;
    }

    .ramp {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: var(--space-3);
    }
    .swatch {
      display: flex;
      flex-direction: column;
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-12);
      overflow: hidden;
      background: var(--color-surface-base);
      transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
    }
    .swatch:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px -8px rgba(17, 17, 17, 0.18);
    }
    .swatch--anchor {
      border-color: var(--color-purple-800);
      box-shadow: 0 0 0 2px var(--color-purple-100);
    }
    .swatch__chip {
      width: 100%;
      height: 92px;
      border: 0;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: var(--space-2);
    }
    .swatch__chip--gap {
      background: repeating-linear-gradient(
        45deg,
        var(--color-neutral-100) 0 6px,
        var(--color-neutral-150) 6px 12px
      );
    }
    .swatch__chip-gap-mark {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-lg);
      pointer-events: none;
    }
    .swatch__hex--muted {
      color: var(--color-text-muted);
      font-style: italic;
    }
    .swatch__anchor-flag {
      font-size: var(--text-sm);
      color: var(--color-white);
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 8px;
      border-radius: var(--radius-round);
      backdrop-filter: blur(4px);
    }
    .swatch__body {
      padding: var(--space-3) var(--space-4) var(--space-4);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .swatch__token {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
      text-align: left;
    }
    .swatch__hex {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      text-align: left;
    }
    .swatch__token--btn, .swatch__hex--btn {
      cursor: pointer;
      padding: 0;
      border-radius: var(--radius-4);
      transition: background 120ms ease;
    }
    .swatch__token--btn:hover, .swatch__hex--btn:hover {
      background: var(--color-purple-100);
      color: var(--color-text-brand);
    }
    .swatch__figma {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      margin-top: var(--space-1);
    }
    .swatch__warn {
      font-size: var(--text-sm);
      color: var(--color-yellow-700);
      background: var(--color-yellow-100);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-4);
      margin-top: var(--space-2);
      line-height: 1.4;
    }
    .swatch--gap { opacity: 0.7; }
    .swatch--gap:hover { transform: none; box-shadow: none; }

    /* ── Swatch edit / reorder UI ──────────────────────────── */

    .swatch__chip {
      position: relative;
    }
    .swatch__chip-copy {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 0;
    }
    .swatch__chip-actions {
      position: absolute;
      top: var(--space-2);
      right: var(--space-2);
      display: flex;
      gap: 4px;
      opacity: 0;
      transform: translateY(-2px);
      transition: opacity 120ms ease, transform 120ms ease;
      pointer-events: none;
      z-index: 2;
    }
    .swatch:hover .swatch__chip-actions,
    .swatch:focus-within .swatch__chip-actions {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .swatch__action {
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-6);
      background: rgba(255, 255, 255, 0.92);
      color: var(--color-neutral-700);
      backdrop-filter: blur(6px);
      box-shadow: 0 1px 3px rgba(17, 17, 17, 0.18);
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease, transform 120ms ease;
    }
    .swatch__action:hover {
      background: var(--color-white);
      color: var(--color-purple-800);
    }
    .swatch__action--drag { cursor: grab; }
    .swatch__action--drag:active { cursor: grabbing; }
    .swatch__action--delete:hover {
      background: var(--color-red-500);
      color: var(--color-white);
    }

    .swatch__anchor-flag {
      position: absolute;
      bottom: var(--space-2);
      right: var(--space-2);
    }

    .swatch--renamed {
      border-color: var(--color-purple-300);
      background: linear-gradient(180deg, var(--color-purple-50) 0%, var(--color-white) 60%);
    }
    .swatch__renamed {
      font-size: var(--text-sm);
      color: var(--color-text-brand);
      margin-top: var(--space-1);
    }
    .swatch__renamed code {
      font-size: var(--text-sm);
      color: var(--color-purple-700);
      background: var(--color-purple-100);
      padding: 1px 4px;
      border-radius: var(--radius-4);
    }

    .swatch--dragging {
      opacity: 0.4;
      transform: scale(0.97);
    }
    .swatch--drop-before {
      box-shadow: inset 3px 0 0 0 var(--color-purple-800);
    }
    .swatch--drop-after {
      box-shadow: inset -3px 0 0 0 var(--color-purple-800);
    }

    /* Inline edit form */
    .swatch--editing {
      border-color: var(--color-purple-800);
      box-shadow: 0 0 0 3px var(--color-purple-100);
    }
    .swatch__edit {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      margin-bottom: 2px;
    }
    .swatch__edit-prefix {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      white-space: nowrap;
      padding-left: var(--space-1);
      align-self: center;
    }
    .swatch__edit-input {
      flex: 1 1 100px;
      min-width: 80px;
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
      background: var(--color-white);
      border: var(--border-sm) solid var(--color-purple-300);
      border-radius: var(--radius-4);
      padding: 2px var(--space-2);
      outline: none;
    }
    .swatch__edit-input:focus {
      border-color: var(--color-purple-800);
      box-shadow: 0 0 0 2px var(--color-purple-100);
    }
    .swatch__edit-actions {
      display: flex;
      gap: 4px;
      width: 100%;
      margin-top: 4px;
    }
    .swatch__edit-save,
    .swatch__edit-cancel {
      flex: 1;
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      padding: 4px var(--space-2);
      border-radius: var(--radius-4);
      cursor: pointer;
      border: var(--border-sm) solid transparent;
    }
    .swatch__edit-save {
      background: var(--color-purple-800);
      color: var(--color-purple-100);
    }
    .swatch__edit-save:hover { background: var(--color-purple-700); }
    .swatch__edit-cancel {
      background: var(--color-surface-base);
      color: var(--color-text-secondary);
      border-color: var(--color-border-subtle);
    }
    .swatch__edit-cancel:hover {
      background: var(--color-neutral-100);
      color: var(--color-text-primary);
    }

    /* Per-group edits bar */
    .group-edits-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-4);
      margin-bottom: var(--space-3);
      background: var(--color-purple-100);
      border: var(--border-sm) solid var(--color-purple-300);
      border-radius: var(--radius-8);
    }
    .group-edits-bar__label {
      font-size: var(--text-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-purple-700);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .group-edits-bar__reset {
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-brand);
      padding: 2px var(--space-2);
      border-radius: var(--radius-4);
      cursor: pointer;
    }
    .group-edits-bar__reset:hover {
      background: var(--color-purple-200);
    }

    /* Deleted-list (inside group-edits-bar) */
    .deleted-list {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex: 1 1 auto;
      flex-wrap: wrap;
      min-width: 0;
    }
    .deleted-list__label {
      font-size: var(--text-sm);
      color: var(--color-purple-700);
      font-weight: var(--font-weight-medium);
    }
    .deleted-list__chip {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      padding: 2px var(--space-2);
      border-radius: var(--radius-round);
      background: var(--color-white);
      border: var(--border-sm) solid var(--color-purple-300);
      font-size: var(--text-sm);
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .deleted-list__chip:hover {
      background: var(--color-purple-100);
      border-color: var(--color-purple-800);
    }
    .deleted-list__chip code {
      font-size: var(--text-sm);
      color: var(--color-text-primary);
      text-decoration: line-through;
      text-decoration-color: var(--color-neutral-450);
    }
    .deleted-list__restore {
      font-size: var(--text-sm);
      color: var(--color-text-brand);
      font-weight: var(--font-weight-medium);
    }

    /* Save bar (sticky at bottom of viewport when there are edits) */
    .save-bar {
      position: fixed;
      left: 50%;
      bottom: var(--space-4);
      transform: translateX(-50%);
      width: min(960px, calc(100% - var(--space-8)));
      z-index: 60;
      animation: save-bar-in 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes save-bar-in {
      from { opacity: 0; transform: translate(-50%, 16px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
    .save-bar__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: var(--space-3) var(--space-3) var(--space-3) var(--space-5);
      background: var(--color-neutral-900);
      color: var(--color-white);
      border-radius: var(--radius-12);
      box-shadow: 0 18px 40px -12px rgba(17, 17, 17, 0.5);
      flex-wrap: wrap;
    }
    .save-bar__text {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex: 1 1 320px;
      min-width: 0;
      font-size: var(--text-base);
      color: var(--color-neutral-200);
    }
    .save-bar__text strong {
      color: var(--color-white);
      font-weight: var(--font-weight-semibold);
      white-space: nowrap;
    }
    .save-bar__sub {
      color: var(--color-neutral-300);
    }
    .save-bar__sub code {
      font-size: var(--text-sm);
      color: var(--color-purple-100);
      background: var(--color-neutral-700);
      padding: 1px 6px;
      border-radius: var(--radius-4);
    }
    .save-bar__dot {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-round);
      background: var(--color-purple-800);
      box-shadow: 0 0 0 3px rgba(95, 77, 199, 0.25);
      animation: pulse 1.6s ease-in-out infinite;
    }
    .save-bar__dot--saved {
      background: var(--color-accent-green-500);
      box-shadow: 0 0 0 3px rgba(139, 195, 74, 0.25);
      animation: none;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(95, 77, 199, 0.25); }
      50%      { box-shadow: 0 0 0 7px rgba(95, 77, 199, 0); }
    }
    .save-bar__actions {
      display: flex;
      gap: var(--space-2);
      flex-shrink: 0;
    }
    .save-bar__btn {
      font-size: var(--text-base);
      font-weight: var(--font-weight-medium);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-8);
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease;
    }
    .save-bar__btn--ghost {
      color: var(--color-neutral-300);
      background: transparent;
      border: var(--border-sm) solid var(--color-neutral-700);
    }
    .save-bar__btn--ghost:hover {
      background: var(--color-neutral-800);
      color: var(--color-white);
    }
    .save-bar__btn--primary {
      background: var(--color-purple-800);
      color: var(--color-white);
      box-shadow: var(--shadow-button);
    }
    .save-bar__btn--primary:hover {
      background: var(--color-purple-700);
    }

    /* ── Semantic table ────────────────────────────────────── */

    .sem-table {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--color-border-subtle);
      border-radius: var(--radius-12);
      overflow: hidden;
      border: var(--border-sm) solid var(--color-border-subtle);
    }
    .sem-row {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-3) var(--space-4);
      background: var(--color-surface-base);
    }
    .sem-row__chip {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-8);
      border: var(--border-sm) solid var(--color-border-subtle);
    }
    .sem-row__main {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .sem-row__token {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-base);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
      text-align: left;
      cursor: pointer;
    }
    .sem-row__token:hover { color: var(--color-text-brand); }
    .sem-row__alias {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }
    .sem-row__hex {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-base);
      color: var(--color-text-secondary);
      cursor: pointer;
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-4);
    }
    .sem-row__hex:hover { background: var(--color-purple-100); color: var(--color-text-brand); }
    .sem-row__warn {
      grid-column: 1 / -1;
      font-size: var(--text-sm);
      color: var(--color-yellow-700);
      background: var(--color-yellow-100);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-4);
    }

    /* ── Type — family/weights ─────────────────────────────── */

    .family-card {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: var(--space-8);
      align-items: center;
      padding: var(--space-8);
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-16);
      background: var(--color-surface-base);
    }
    .family-card__big {
      font-size: 180px;
      line-height: 1;
      font-weight: var(--font-weight-semibold);
      color: var(--color-purple-800);
      letter-spacing: -0.04em;
    }
    .family-card__name {
      font-size: var(--text-xl);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
    }
    .family-card__sub {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      margin-top: 2px;
    }
    .family-card__line {
      margin-top: var(--space-4);
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      color: var(--color-text-brand);
    }
    .family-card__sample {
      margin-top: var(--space-4);
      font-size: var(--text-md);
      color: var(--color-text-secondary);
    }

    .weights-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: var(--space-3);
    }
    .weight-card {
      padding: var(--space-6);
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-12);
      background: var(--color-surface-base);
    }
    .weight-card__sample {
      font-size: var(--text-2xl);
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--color-text-primary);
      margin-bottom: var(--space-4);
    }
    .weight-card__name {
      font-size: var(--text-base);
      color: var(--color-text-secondary);
    }
    .weight-card__token {
      display: block;
      margin-top: var(--space-1);
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    /* ── Generic scale tables (type, spacing, sizing) ──────── */

    .scale-table {
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-12);
      overflow: hidden;
      background: var(--color-surface-base);
    }
    .scale-table__head {
      display: grid;
      gap: var(--space-4);
      padding: var(--space-3) var(--space-4);
      background: var(--color-surface-subtle);
      font-size: var(--text-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-secondary);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .scale-table__row {
      display: grid;
      gap: var(--space-4);
      padding: var(--space-3) var(--space-4);
      align-items: center;
      border-top: var(--border-sm) solid var(--color-border-subtle);
    }
    .type-table .scale-table__head,
    .type-table .scale-table__row {
      grid-template-columns: 1.5fr 1fr 1fr 1fr 0.6fr 2fr;
    }
    .type-table .scale-table__row { position: relative; }
    .type-table .scale-table__note {
      grid-column: 6 / -1;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      margin-top: 2px;
    }
    .bars-head,
    .bars-row {
      grid-template-columns: 1.5fr 0.7fr 0.7fr 2.5fr 1.5fr;
    }
    .scale-table__token {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-base);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
      text-align: left;
      cursor: pointer;
    }
    .scale-table__token:hover { color: var(--color-text-brand); }
    .scale-table__alias {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }
    .scale-table__val {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      display: flex;
      flex-direction: column;
    }
    .num {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-base);
      color: var(--color-text-primary);
    }
    .num--muted { color: var(--color-text-muted); font-size: var(--text-sm); }
    .blank-cell { color: var(--color-text-muted); font-style: italic; font-size: var(--text-sm); }
    .scale-table__preview {
      color: var(--color-text-primary);
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .scale-table__note {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    /* Spacing / sizing bars */
    .scale-table__bar-cell {
      display: flex;
      align-items: center;
    }
    .bar {
      display: block;
      height: 16px;
      border-radius: var(--radius-2);
      background: linear-gradient(90deg, var(--color-purple-800), var(--color-purple-650));
    }
    .bar--size {
      background: linear-gradient(90deg, var(--color-edge-blue-800), var(--color-edge-blue-650));
    }

    /* ── Radius cards ──────────────────────────────────────── */

    .radius-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: var(--space-3);
    }
    .radius-card {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      padding: var(--space-4);
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-12);
      background: var(--color-surface-base);
    }
    .radius-card__demo {
      width: 100%;
      aspect-ratio: 2 / 1;
      background: linear-gradient(135deg, var(--color-purple-800), var(--color-purple-700));
    }
    .radius-card__token {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-base);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
      text-align: left;
      cursor: pointer;
    }
    .radius-card__token:hover { color: var(--color-text-brand); }
    .radius-card__val {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .radius-card__note {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    /* ── Border cards ──────────────────────────────────────── */

    .border-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: var(--space-3);
    }
    .border-card {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      padding: var(--space-4);
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-12);
      background: var(--color-surface-base);
    }
    .border-card__demo {
      width: 100%;
      aspect-ratio: 2 / 1;
      border-style: solid;
      border-color: var(--color-purple-800);
      border-radius: var(--radius-8);
      background: var(--color-purple-100);
    }
    .border-card__token {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-base);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
      text-align: left;
      cursor: pointer;
    }
    .border-card__token:hover { color: var(--color-text-brand); }
    .border-card__val { display: flex; flex-direction: column; gap: 2px; }
    .border-card__note { font-size: var(--text-sm); color: var(--color-text-muted); }

    /* ── CSS Variables block ───────────────────────────────── */

    .css-block {
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-12);
      overflow: hidden;
      background: var(--color-neutral-900);
    }
    .css-block__bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) var(--space-4);
      background: var(--color-neutral-850);
      border-bottom: var(--border-sm) solid var(--color-neutral-700);
    }
    .css-block__path {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      color: var(--color-neutral-300);
    }
    .css-block__copy {
      background: var(--color-purple-800);
      color: var(--color-purple-100);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-6);
      font-size: var(--text-base);
      font-weight: var(--font-weight-medium);
      cursor: pointer;
      transition: background 120ms ease;
      box-shadow: var(--shadow-button);
    }
    .css-block__copy:hover { background: var(--color-purple-700); }
    .css-block__copy--active { background: var(--color-accent-green-500); color: var(--color-accent-green-900); }
    .css-block__pre {
      margin: 0;
      padding: var(--space-6);
      max-height: 480px;
      overflow: auto;
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      line-height: 1.65;
      color: var(--color-neutral-200);
      white-space: pre;
    }

    /* ── Footer + toast ────────────────────────────────────── */

    .footer {
      margin-top: var(--space-16);
      padding: var(--space-8) 0;
      border-top: var(--border-sm) solid var(--color-border-subtle);
    }
    .footer__row {
      display: flex;
      justify-content: space-between;
      gap: var(--space-4);
      flex-wrap: wrap;
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
    }
    .footer__muted { color: var(--color-text-muted); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: var(--space-8);
      transform: translate(-50%, 24px);
      background: var(--color-neutral-900);
      color: var(--color-white);
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-round);
      font-size: var(--text-base);
      font-weight: var(--font-weight-medium);
      font-family: "JetBrains Mono", monospace;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
      box-shadow: 0 12px 32px -10px rgba(17, 17, 17, 0.5);
      z-index: 100;
    }
    .toast--visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ── Swatch edit form (multi-field) ────────────────────── */
    .swatch__edit {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      width: 100%;
    }
    .swatch__edit-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .swatch__edit-label {
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-secondary);
      letter-spacing: 0.02em;
    }
    .swatch__edit-field {
      display: flex;
      align-items: stretch;
      gap: 4px;
      background: var(--color-white);
      border: var(--border-sm) solid var(--color-purple-300);
      border-radius: var(--radius-4);
      padding: 2px;
    }
    .swatch__edit-field:focus-within {
      border-color: var(--color-purple-800);
      box-shadow: 0 0 0 2px var(--color-purple-100);
    }
    .swatch__edit-input--invalid {
      color: var(--color-red-600);
    }
    .swatch__edit-field .swatch__edit-input {
      flex: 1 1 100px;
      min-width: 0;
      border: 0;
      background: transparent;
      padding: 2px var(--space-2);
      outline: none;
    }
    .swatch__edit-color {
      width: 28px;
      height: 28px;
      border: 0;
      background: transparent;
      padding: 0;
      border-radius: var(--radius-4);
      cursor: pointer;
      flex-shrink: 0;
    }
    .swatch__edit-color::-webkit-color-swatch-wrapper { padding: 0; }
    .swatch__edit-color::-webkit-color-swatch { border: var(--border-sm) solid var(--color-border-subtle); border-radius: var(--radius-4); }
    .swatch__edit-err {
      font-size: var(--text-sm);
      color: var(--color-red-700);
      background: var(--color-red-100);
      padding: 2px var(--space-2);
      border-radius: var(--radius-4);
    }
    .swatch__edit-save:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .swatch__chip-fill {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      letter-spacing: 0.04em;
      transition: color 120ms ease, background 120ms ease;
    }
    .swatch__chip-fill:hover {
      background: var(--color-purple-100);
      color: var(--color-text-brand);
    }
    .swatch__chip-fill .swatch__chip-gap-mark {
      position: static;
      font-size: var(--text-sm);
      text-transform: uppercase;
    }
    .swatch--filled {
      border-color: var(--color-accent-green-500);
      background: linear-gradient(180deg, var(--color-accent-green-100) 0%, var(--color-white) 60%);
    }

    /* ── Buttons section ───────────────────────────────────── */

    .btn-size-tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--color-surface-subtle);
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-12);
      margin-bottom: var(--space-4);
      width: fit-content;
      flex-wrap: wrap;
    }
    .btn-size-tab {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-8);
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease, box-shadow 120ms ease;
      min-width: 90px;
    }
    .btn-size-tab:hover { background: var(--color-surface-elevated); }
    .btn-size-tab.is-active {
      background: var(--color-surface-elevated);
      box-shadow: 0 1px 2px rgba(17,17,17,0.08), 0 0 0 1px var(--color-border-brand);
    }
    .btn-size-tab__name {
      font-size: var(--text-base);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
    }
    .btn-size-tab__px {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }
    .btn-size-tab.is-active .btn-size-tab__px { color: var(--color-text-brand); }

    .btn-size-meta {
      display: flex;
      align-items: center;
      gap: var(--space-6);
      padding: var(--space-3) var(--space-4);
      background: var(--color-surface-brand);
      border-radius: var(--radius-8);
      margin-bottom: var(--space-8);
      flex-wrap: wrap;
    }
    .btn-size-meta__item {
      display: flex;
      flex-direction: column;
    }
    .btn-size-meta__label {
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .btn-size-meta__value {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-base);
      color: var(--color-text-primary);
    }
    .btn-size-meta__item--note {
      font-size: var(--text-base);
      color: var(--color-text-secondary);
      flex: 1 1 200px;
      font-style: italic;
    }

    .btn-matrix {
      padding: var(--space-6);
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-12);
      overflow: auto;
    }
    .btn-matrix--dark {
      border-color: var(--color-neutral-700);
    }
    .btn-matrix__grid {
      display: grid;
      grid-template-columns: 180px repeat(5, minmax(160px, 1fr));
      gap: var(--space-4);
      align-items: stretch;
      min-width: 980px;
    }
    .btn-matrix__corner { }
    .btn-matrix__col-head {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding-bottom: var(--space-2);
      border-bottom: var(--border-sm) solid var(--color-border-subtle);
    }
    .btn-matrix--dark .btn-matrix__col-head {
      color: var(--color-neutral-300);
      border-color: var(--color-neutral-700);
    }
    .btn-matrix__row-head {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-right: var(--space-3);
      border-right: var(--border-sm) solid var(--color-border-subtle);
    }
    .btn-matrix--dark .btn-matrix__row-head {
      border-color: var(--color-neutral-700);
    }
    .btn-matrix__row-name {
      font-size: var(--text-lg);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
    }
    .btn-matrix--dark .btn-matrix__row-name { color: var(--color-purple-100); }
    .btn-matrix__row-note {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      line-height: 1.45;
    }
    .btn-matrix--dark .btn-matrix__row-note { color: var(--color-neutral-300); }
    .btn-matrix__cell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80px;
    }
    .btn-preview {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pb {
      font-family: var(--font-family-base);
      font-weight: var(--font-weight-medium);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      transition: transform 120ms ease;
      box-sizing: border-box;
    }
    .pb:not(:disabled):active { transform: translateY(1px); }
    .pb--tertiary {
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
    }
    .pb--tertiary.pb--hovered,
    .pb--tertiary.pb--selected {
      /* allow bg from inline style to come through */
    }
    .pb--tertiary { height: auto !important; }
    .pb--icon-only .pb__label { display: none; }

    /* ── Tweaks Panel ──────────────────────────────────────── */

    .tweaks {
      position: fixed;
      right: var(--space-6);
      bottom: var(--space-6);
      width: 320px;
      max-height: calc(100vh - var(--space-12));
      z-index: 70;
      background: var(--color-surface-base);
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-16);
      box-shadow: 0 18px 48px -12px rgba(17, 17, 17, 0.28);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: tweaks-in 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes tweaks-in {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .tweaks__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) var(--space-4);
      border-bottom: var(--border-sm) solid var(--color-border-subtle);
      background: var(--color-purple-100);
    }
    .tweaks__title {
      font-size: var(--text-md);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-brand);
      letter-spacing: 0.02em;
    }
    .tweaks__close {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-6);
      cursor: pointer;
      color: var(--color-text-secondary);
      transition: background 120ms ease, color 120ms ease;
    }
    .tweaks__close:hover {
      background: var(--color-purple-200);
      color: var(--color-text-brand);
    }
    .tweaks__body {
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      overflow: auto;
    }
    .tweaks__section {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .tweaks__section-title {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .tweaks__field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .tweaks__field--toggle {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }
    .tweaks__field-label {
      font-size: var(--text-base);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
    }
    .tweaks__text, .tweaks__select {
      font: inherit;
      font-size: var(--text-base);
      padding: var(--space-2) var(--space-3);
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-6);
      background: var(--color-white);
      color: var(--color-text-primary);
      outline: none;
    }
    .tweaks__text:focus, .tweaks__select:focus {
      border-color: var(--color-purple-800);
      box-shadow: 0 0 0 2px var(--color-purple-100);
    }
    .tweaks__toggle {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }
    .tweaks__bg-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-2);
    }
    .tweaks__bg {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-8);
      border: var(--border-sm) solid var(--color-border-subtle);
      background: var(--color-surface-base);
      cursor: pointer;
      transition: border-color 120ms ease, background 120ms ease;
    }
    .tweaks__bg:hover { background: var(--color-surface-subtle); }
    .tweaks__bg.is-active {
      border-color: var(--color-purple-800);
      background: var(--color-purple-100);
    }
    .tweaks__bg-swatch {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-6);
      border: var(--border-sm) solid var(--color-border-subtle);
      flex-shrink: 0;
    }
    .tweaks__bg-name {
      font-size: var(--text-base);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
    }

    /* ── Fields ───────────────────────────────────────────────── */

    .field-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--space-4) var(--space-6);
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: var(--field-gap-title);
    }
    .field__title {
      font-size: var(--field-medium-title);
      line-height: 1.2;
      color: var(--color-text-secondary);
      font-weight: var(--font-weight-medium);
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .field--small .field__title { font-size: var(--field-small-title); }
    .field__mandatory {
      color: var(--color-danger);
      font-weight: var(--font-weight-bold);
    }
    .field__shell {
      position: relative;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      height: var(--field-medium-height);
      padding: 0 var(--field-medium-pad-x);
      background: var(--color-surface-elevated);
      border: var(--field-border-width) solid var(--color-border-subtle);
      border-radius: var(--field-radius);
      transition: var(--transition-color), box-shadow var(--duration-fast) var(--easing-standard);
      color: var(--color-text-primary);
    }
    .field--small .field__shell {
      height: var(--field-small-height);
      padding: 0 var(--field-small-pad-x);
    }
    .field--otp { gap: var(--space-3); }
    .field--otp .field__title { margin-bottom: 0; }
    .field__otp-row {
      display: flex;
      gap: var(--space-2);
    }
    .field__otp-box {
      width: 48px;
      height: var(--field-medium-height);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-surface-elevated);
      border: var(--field-border-width) solid var(--color-border-subtle);
      border-radius: var(--field-radius);
      color: var(--color-text-primary);
    }
    .field--small .field__otp-box { height: var(--field-small-height); width: 40px; }
    .field__otp-cursor {
      width: 2px;
      height: 60%;
      background: var(--color-brand-primary);
      animation: field-cursor 1s var(--easing-emphasized) infinite;
    }
    @keyframes field-cursor { 50% { opacity: 0; } }

    .field__input {
      flex: 1 1 auto;
      min-width: 0;
      background: transparent;
      border: 0;
      outline: none;
      font: inherit;
      color: var(--color-text-primary);
      font-size: var(--field-medium-font);
      line-height: var(--field-medium-line);
    }
    .field--small .field__input {
      font-size: var(--field-small-font);
      line-height: var(--field-small-line);
    }
    .field__input::placeholder { color: var(--color-text-muted); }
    .field__input:disabled { cursor: not-allowed; }
    .field__helper {
      color: var(--color-text-muted);
      font-size: inherit;
      line-height: inherit;
      pointer-events: none;
      margin-left: -8px; /* sit close to placeholder */
    }
    .field__icon {
      flex-shrink: 0;
      color: var(--color-text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .field__icon--leading { margin-right: -4px; }
    .field__icon--trailing { margin-left: auto; }
    .field__icon-button {
      flex-shrink: 0;
      height: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 var(--space-2);
      margin-right: calc(-1 * var(--field-medium-pad-x));
      border-left: var(--border-sm) solid var(--color-border-subtle);
      color: var(--color-text-secondary);
      cursor: pointer;
    }
    .field--small .field__icon-button { margin-right: calc(-1 * var(--field-small-pad-x)); }

    .field__desc {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      font-size: var(--field-medium-desc);
      color: var(--color-text-muted);
      line-height: 1.4;
    }
    .field--small .field__desc { font-size: var(--field-small-desc); }

    /* States */
    .field--state-hover .field__shell,
    .field--state-hover .field__otp-box {
      border-color: var(--color-border-default);
    }
    .field--state-focus .field__shell,
    .field--state-focus .field__otp-box {
      border-color: var(--color-border-brand);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-border-focus) 32%, transparent);
    }
    .field--state-filled .field__shell { border-color: var(--color-border-default); }
    .field--state-error .field__shell,
    .field--state-error .field__otp-box {
      border-color: var(--color-danger);
    }
    .field--state-error .field__icon--trailing { color: var(--color-danger); }
    .field--state-error .field__desc-text { color: var(--color-danger); }
    .field--state-disabled .field__shell,
    .field--state-disabled .field__otp-box {
      background: var(--color-surface-subtle);
      border-color: var(--color-border-subtle);
      color: var(--color-text-disabled);
      opacity: 0.7;
    }
    .field--state-disabled .field__input,
    .field--state-disabled .field__input::placeholder { color: var(--color-text-disabled); }

    /* ── Chips ────────────────────────────────────────────────── */

    .chip {
      display: inline-flex;
      align-items: center;
      gap: var(--chip-mobile-gap);
      height: var(--chip-mobile-height);
      padding: 0 var(--chip-mobile-pad-x);
      border-radius: var(--chip-radius);
      border: var(--chip-border-width) solid transparent;
      background: transparent;
      font-family: var(--font-family-base);
      font-weight: var(--font-weight-medium);
      font-size: var(--chip-mobile-font);
      line-height: var(--chip-mobile-line);
      color: var(--color-text-primary);
      white-space: nowrap;
      transition: var(--transition-color);
      cursor: default;
    }
    .chip--small {
      height: var(--chip-small-height);
      padding: 0 var(--chip-small-pad-x);
      font-size: var(--chip-small-font);
      gap: var(--chip-small-gap);
    }
    .chip--medium {
      height: var(--chip-medium-height);
      padding: 0 var(--chip-medium-pad-x);
      font-size: var(--chip-medium-font);
      gap: var(--chip-medium-gap);
    }
    .chip--actionable, .chip--selector { cursor: pointer; }
    .chip__icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .chip__icon svg { width: var(--chip-mobile-icon); height: var(--chip-mobile-icon); }
    .chip--small .chip__icon svg { width: var(--chip-small-icon); height: var(--chip-small-icon); }
    .chip--medium .chip__icon svg { width: var(--chip-medium-icon); height: var(--chip-medium-icon); }
    .chip__icon--trailing { margin-right: -4px; }

    /* Filled */
    .chip--filled.chip--color-neutral   { background: var(--color-surface-subtle); border-color: var(--color-border-subtle); color: var(--color-text-primary); }
    .chip--filled.chip--color-primary   { background: var(--color-purple-100); border-color: var(--color-purple-300); color: var(--color-purple-800); }
    .chip--filled.chip--color-secondary { background: var(--color-edge-blue-100); border-color: var(--color-edge-blue-300); color: var(--color-edge-blue-800); }
    .chip--filled.chip--color-success   { background: var(--color-accent-green-100); border-color: var(--color-accent-green-300); color: var(--color-accent-green-700); }

    [data-theme="dark"] .chip--filled.chip--color-neutral   { background: var(--color-neutral-800); border-color: var(--color-neutral-700); color: var(--color-text-primary); }
    [data-theme="dark"] .chip--filled.chip--color-primary   { background: var(--color-purple-900); border-color: var(--color-purple-700); color: var(--color-purple-200); }
    [data-theme="dark"] .chip--filled.chip--color-secondary { background: var(--color-edge-blue-900); border-color: var(--color-edge-blue-700); color: var(--color-edge-blue-200); }
    [data-theme="dark"] .chip--filled.chip--color-success   { background: var(--color-accent-green-900); border-color: var(--color-accent-green-700); color: var(--color-accent-green-300); }

    /* Outlined */
    .chip--outlined { background: transparent; }
    .chip--outlined.chip--color-neutral   { border-color: var(--color-border-default); color: var(--color-text-secondary); }
    .chip--outlined.chip--color-primary   { border-color: var(--color-purple-700); color: var(--color-purple-800); }
    .chip--outlined.chip--color-secondary { border-color: var(--color-edge-blue-700); color: var(--color-edge-blue-800); }
    .chip--outlined.chip--color-success   { border-color: var(--color-accent-green-600); color: var(--color-accent-green-700); }

    [data-theme="dark"] .chip--outlined.chip--color-primary   { border-color: var(--color-purple-500); color: var(--color-purple-300); }
    [data-theme="dark"] .chip--outlined.chip--color-secondary { border-color: var(--color-edge-blue-500); color: var(--color-edge-blue-300); }
    [data-theme="dark"] .chip--outlined.chip--color-success   { border-color: var(--color-accent-green-500); color: var(--color-accent-green-300); }

    /* Selector */
    .chip--selector { background: transparent; border-color: var(--color-border-subtle); color: var(--color-text-secondary); }
    .chip--selector:hover { background: var(--color-surface-subtle); border-color: var(--color-border-default); color: var(--color-text-primary); }
    .chip--selector.is-selected.chip--color-neutral   { background: var(--color-surface-subtle); border-color: var(--color-text-primary); color: var(--color-text-primary); }
    .chip--selector.is-selected.chip--color-primary   { background: var(--color-purple-100); border-color: var(--color-purple-800); color: var(--color-purple-800); }
    .chip--selector.is-selected.chip--color-secondary { background: var(--color-edge-blue-100); border-color: var(--color-edge-blue-800); color: var(--color-edge-blue-800); }
    .chip--selector.is-selected.chip--color-success   { background: var(--color-accent-green-100); border-color: var(--color-accent-green-700); color: var(--color-accent-green-700); }

    [data-theme="dark"] .chip--selector.is-selected.chip--color-neutral   { background: var(--color-neutral-800); border-color: var(--color-neutral-300); color: var(--color-text-primary); }
    [data-theme="dark"] .chip--selector.is-selected.chip--color-primary   { background: var(--color-purple-900); border-color: var(--color-purple-400); color: var(--color-purple-200); }
    [data-theme="dark"] .chip--selector.is-selected.chip--color-secondary { background: var(--color-edge-blue-900); border-color: var(--color-edge-blue-400); color: var(--color-edge-blue-200); }
    [data-theme="dark"] .chip--selector.is-selected.chip--color-success   { background: var(--color-accent-green-900); border-color: var(--color-accent-green-400); color: var(--color-accent-green-300); }

    .chip--actionable:hover:not(:disabled) { transform: translateY(-1px); }
    .chip.is-disabled, .chip:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Dark-theme remaps for brand-tinted chrome ──────────────
       These elements used raw light tokens (purple-100 / white) that
       don't change with theme. Re-map them to theme-aware surfaces so
       they flip correctly under [data-theme="dark"]. */
    [data-theme="dark"] .topnav__group-trigger:hover,
    [data-theme="dark"] .topnav__group.is-open .topnav__group-trigger,
    [data-theme="dark"] .topnav__menu-link:hover,
    [data-theme="dark"] .swatch__token--btn:hover,
    [data-theme="dark"] .swatch__hex--btn:hover,
    [data-theme="dark"] .sem-row__hex:hover,
    [data-theme="dark"] .swatch__chip-fill:hover,
    [data-theme="dark"] .deleted-list__chip:hover {
      background: var(--color-surface-brand);
      color: var(--color-text-brand);
    }
    [data-theme="dark"] .group-edits-bar {
      background: var(--color-surface-brand);
      border-color: var(--color-border-brand);
    }
    [data-theme="dark"] .border-card__demo {
      background: var(--color-surface-brand);
      border-color: var(--color-border-brand);
    }
    [data-theme="dark"] .tweaks__head {
      background: var(--color-surface-brand);
    }
    [data-theme="dark"] .tweaks__bg.is-active {
      background: var(--color-surface-brand);
      border-color: var(--color-border-brand);
    }
    [data-theme="dark"] .tweaks__text,
    [data-theme="dark"] .tweaks__select,
    [data-theme="dark"] .swatch__edit-input,
    [data-theme="dark"] .swatch__edit-field,
    [data-theme="dark"] .deleted-list__chip {
      background: var(--color-surface-elevated);
    }

    /* Chip matrix layout */
    .chip-matrix {
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-12);
      overflow: hidden;
      background: var(--color-surface-elevated);
    }
    .chip-matrix__head,
    .chip-matrix__row {
      display: grid;
      grid-template-columns: 180px repeat(3, 1fr);
      align-items: center;
      padding: var(--space-3) var(--space-4);
      border-top: var(--border-sm) solid var(--color-border-subtle);
      gap: var(--space-3);
    }
    .chip-matrix__head {
      background: var(--color-surface-subtle);
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-top: 0;
    }
    .chip-matrix__row-head { display: flex; flex-direction: column; gap: 2px; }
    .chip-matrix__row-name {
      font-size: var(--text-md);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
    }
    .chip-matrix__row-note { font-size: var(--text-sm); color: var(--color-text-muted); }
    .chip-matrix__cell {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: var(--space-2);
      flex-wrap: wrap;
    }
    .chip-matrix__cell--multi { gap: var(--space-2); }

    .chip-cluster {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      padding: var(--space-6);
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-12);
      background: var(--color-surface-elevated);
    }
    .chip-cluster__group { display: flex; flex-direction: column; gap: var(--space-3); }
    .chip-cluster__label {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .chip-cluster__items {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    /* ── Tables ───────────────────────────────────────────────── */

    .table-wrap {
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--table-radius);
      overflow: hidden;
      background: var(--color-surface-elevated);
      overflow-x: auto;
    }
    .ds-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-family: var(--font-family-base);
      font-size: var(--text-md);
      min-width: 880px;
    }
    .ds-table__th {
      background: var(--color-surface-subtle);
      color: var(--color-text-muted);
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0 var(--table-cell-pad-x);
      height: var(--table-header-height);
      text-align: left;
      border-bottom: var(--border-sm) solid var(--color-border-subtle);
      white-space: nowrap;
    }
    .ds-table__th--center { text-align: center; }
    .ds-table__th--right  { text-align: right; }
    .ds-table__th--actions { width: 120px; }
    .ds-table__sort {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: inherit;
      font: inherit;
      text-transform: inherit;
      letter-spacing: inherit;
      transition: var(--transition-color);
    }
    .ds-table__sort:hover { color: var(--color-text-primary); }
    .ds-table__sort-icon {
      display: inline-flex;
      color: var(--color-text-muted);
      transition: transform var(--duration-fast) var(--easing-standard), color var(--duration-fast) var(--easing-standard);
    }
    .ds-table__sort-icon.is-asc  { color: var(--color-text-primary); transform: rotate(180deg); }
    .ds-table__sort-icon.is-desc { color: var(--color-text-primary); }
    .ds-table__row {
      background: var(--color-surface-elevated);
      transition: background-color var(--duration-fast) var(--easing-standard);
    }
    .ds-table__row:hover { background: var(--color-surface-subtle); }
    .table-wrap--compact .ds-table__row td { height: var(--table-row-compact); }
    .table-wrap--comfortable .ds-table__row td { height: var(--table-row-height); }
    .ds-table__td {
      padding: 0 var(--table-cell-pad-x);
      color: var(--color-text-secondary);
      vertical-align: middle;
      border-top: var(--border-sm) solid var(--color-border-subtle);
    }
    .ds-table__td--mono {
      font-family: "JetBrains Mono", monospace;
      color: var(--color-text-primary);
    }
    .ds-table__td--center { text-align: center; }
    .ds-table__td--right  { text-align: right; }
    .ds-table__id-icon {
      display: inline-flex;
      vertical-align: middle;
      margin-right: var(--space-2);
      color: var(--color-brand-accent);
    }
    .ds-table__avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: var(--radius-round);
      background: var(--color-surface-brand);
      color: var(--color-text-brand);
      font-weight: var(--font-weight-semibold);
      font-size: var(--text-sm);
      margin-right: var(--space-3);
      vertical-align: middle;
    }
    .ds-table__td--actions {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-2);
      opacity: 0;
      transition: opacity var(--duration-fast) var(--easing-standard);
      width: 100%;
      height: var(--table-row-height);
    }
    .ds-table__row:hover .ds-table__td--actions,
    .ds-table__row:focus-within .ds-table__td--actions { opacity: 1; }
    .ds-table__action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-6);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: var(--transition-color);
    }
    .ds-table__action:hover {
      background: var(--color-surface-brand);
      color: var(--color-text-brand);
    }
    .ds-table__action--danger:hover {
      background: var(--color-danger-surface);
      color: var(--color-danger);
    }

    /* ── Component-scoped token cards (shared by Field/Chip/Table) ── */
    .comp-token-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: var(--space-2);
    }
    .comp-token-card {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: var(--space-3) var(--space-4);
      background: var(--color-surface-elevated);
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-8);
      text-align: left;
      cursor: pointer;
      transition: var(--transition-color), border-color var(--duration-fast) var(--easing-standard);
    }
    .comp-token-card:hover { border-color: var(--color-border-brand); }
    .comp-token-card__name {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      color: var(--color-text-primary);
      font-weight: var(--font-weight-medium);
    }
    .comp-token-card__val {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    /* ── Platform switcher (topbar) ──────────────────────────── */

    .platform-switcher {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-shrink: 0;
    }
    .platform-switcher__row {
      display: flex;
      gap: 2px;
      padding: 3px;
      background: var(--color-surface-subtle);
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-round);
    }
    .platform-switcher__chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px var(--space-2);
      border-radius: var(--radius-round);
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: var(--transition-color);
    }
    .platform-switcher__chip:hover {
      color: var(--color-text-primary);
      background: var(--color-surface-base);
    }
    .platform-switcher__chip.is-active {
      background: var(--color-surface-base);
      color: var(--color-text-primary);
      box-shadow: var(--shadow-1);
    }
    .platform-switcher__chip-dot {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-round);
      flex-shrink: 0;
    }
    .platform-switcher__theme {
      display: flex;
      gap: 2px;
      padding: 3px;
      background: var(--color-surface-subtle);
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-round);
    }
    .platform-switcher__theme-btn {
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-round);
      color: var(--color-text-muted);
      cursor: pointer;
      transition: var(--transition-color);
    }
    .platform-switcher__theme-btn:hover {
      color: var(--color-text-primary);
    }
    .platform-switcher__theme-btn.is-active {
      background: var(--color-surface-base);
      color: var(--color-brand-primary);
      box-shadow: var(--shadow-1);
    }

    /* ── Surfaces ──────────────────────────────────────────── */

    .surface-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--space-3);
    }
    .surface-card {
      display: flex;
      flex-direction: column;
      gap: 0;
      border: var(--border-sm) solid var(--color-border-subtle);
      border-radius: var(--radius-12);
      overflow: hidden;
      background: var(--color-surface-elevated);
      text-align: left;
      cursor: pointer;
      transition: var(--transition-transform), box-shadow var(--duration-fast) var(--easing-standard);
      padding: 0;
    }
    .surface-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
    .surface-card__chip {
      height: 80px;
      border-bottom: var(--border-sm) solid var(--color-border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
    }
    .surface-card__chip-mark {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      color: var(--color-white);
      letter-spacing: 0.04em;
    }
    .surface-card__body {
      padding: var(--space-3) var(--space-4) var(--space-4);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .surface-card__token {
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      color: var(--color-text-primary);
      font-weight: var(--font-weight-medium);
    }
    .surface-card__note {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }
    .surface-card__values {
      margin-top: var(--space-2);
      display: flex;
      gap: var(--space-3);
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      flex-wrap: wrap;
    }
    .surface-card__val {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* ── Surface stacks (v0.3.2) ──────────────────────────── */

    .surface-stacks {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-6);
    }
    @media (min-width: 900px) {
      .surface-stacks { grid-template-columns: 1fr 1fr; }
    }
    .surface-stack {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      padding: var(--space-4);
      border-radius: var(--radius-12);
      border: var(--border-sm) solid var(--color-border-subtle);
      background: var(--color-surface-subtle);
    }
    .surface-stack__head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--space-3);
      flex-wrap: wrap;
    }
    .surface-stack__title {
      margin: 0;
      font-size: var(--text-lg);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
      line-height: 1.2;
    }
    .surface-stack__sub {
      margin: 4px 0 0;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }
    .surface-stack__plats {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .surface-stack__plat {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: var(--radius-round);
      background: var(--color-surface-base);
      border: var(--border-sm) solid var(--color-border-subtle);
      color: var(--color-text-secondary);
      white-space: nowrap;
    }
    .surface-stack__canvas {
      padding: var(--space-3);
      border-radius: var(--radius-8);
      display: flex;
      flex-direction: column;
      gap: 6px;
      border: var(--border-sm) solid color-mix(in srgb, currentColor 15%, transparent);
    }
    .surface-stack.is-dark .surface-stack__canvas {
      border-color: var(--color-neutral-700);
    }
    .surface-stack__layer {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-6);
      border: var(--border-sm) solid color-mix(in srgb, currentColor 12%, transparent);
      text-align: left;
      cursor: pointer;
      transition: transform var(--duration-fast) var(--easing-standard), box-shadow var(--duration-fast) var(--easing-standard);
      min-height: 64px;
    }
    .surface-stack.is-light .surface-stack__layer { color: var(--color-neutral-900); border-color: var(--color-neutral-150); }
    .surface-stack.is-dark .surface-stack__layer { color: var(--color-neutral-100); border-color: var(--color-neutral-700); }
    .surface-stack__layer:hover { transform: translateX(2px); box-shadow: var(--shadow-2); }
    .surface-stack__layer-num {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: inherit;
      opacity: 0.55;
      letter-spacing: 0.04em;
    }
    .surface-stack__layer-body {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .surface-stack__layer-name {
      font-size: var(--text-base);
      font-weight: var(--font-weight-semibold);
      color: inherit;
    }
    .surface-stack__layer-note {
      font-size: var(--text-sm);
      color: inherit;
      opacity: 0.7;
      line-height: 1.4;
    }
    .surface-stack__layer-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
    }
    .surface-stack__layer-hex,
    .surface-stack__layer-raw {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: inherit;
      opacity: 0.8;
    }
    .surface-stack__layer-raw { opacity: 0.55; }

    /* ── Grids (v0.3.2) ────────────────────────────────────── */

    .grid-table {
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-radius: var(--radius-12);
      overflow: hidden;
      border: var(--border-sm) solid var(--color-border-subtle);
    }
    .grid-table__head,
    .grid-table__row {
      display: grid;
      grid-template-columns: 1.4fr 1.5fr 0.6fr 0.9fr 0.9fr;
      gap: var(--space-4);
      align-items: center;
      padding: var(--space-3) var(--space-4);
      background: var(--color-surface-base);
    }
    .grid-table__head {
      background: var(--color-surface-subtle);
      font-family: "JetBrains Mono", monospace;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .grid-table__row {
      border-top: var(--border-sm) solid var(--color-border-subtle);
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
      transition: background-color var(--duration-fast) var(--easing-standard);
    }
    .grid-table__row:hover { background: var(--color-surface-subtle); }
    .grid-table__row.is-active {
      background: var(--color-surface-brand);
      box-shadow: inset 3px 0 0 0 var(--color-purple-800);
    }
    .grid-table__device {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .grid-table__device-name {
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
    }
    .grid-table__device-orient {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--color-text-muted);
      letter-spacing: 0.04em;
    }
    .grid-table__range,
    .grid-table__cols,
    .grid-table__pad,
    .grid-table__gut {
      font-size: var(--text-base);
      color: var(--color-text-secondary);
    }
    .grid-table__cols { color: var(--color-text-primary); font-weight: var(--font-weight-semibold); }

    .grid-preview {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-4);
    }
    @media (min-width: 900px) {
      .grid-preview { grid-template-columns: 1fr 260px; }
    }
    .grid-preview__stage {
      padding: var(--space-4);
      background: var(--color-surface-subtle);
      border-radius: var(--radius-12);
      border: var(--border-sm) solid var(--color-border-subtle);
      overflow: hidden;
    }
    .grid-frame {
      position: relative;
      background: var(--color-surface-base);
      border-radius: var(--radius-8);
      border: var(--border-sm) solid var(--color-border-default);
      overflow: hidden;
      min-height: 320px;
      display: flex;
      flex-direction: column;
    }
    .grid-frame__label {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--color-text-muted);
      background: var(--color-surface-base);
      padding: 2px 8px;
      border-radius: var(--radius-round);
      border: var(--border-sm) solid var(--color-border-subtle);
      white-space: nowrap;
      z-index: 1;
    }
    .grid-frame__inner {
      flex: 1;
      padding-top: 40px;
      padding-bottom: 32px;
      position: relative;
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--color-purple-800) 8%, transparent) 0 100%) left top / var(--_pad-l, 0) 100% no-repeat,
        linear-gradient(90deg, color-mix(in srgb, var(--color-purple-800) 8%, transparent) 0 100%) right top / var(--_pad-r, 0) 100% no-repeat;
    }
    .grid-frame__cols {
